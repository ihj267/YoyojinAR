<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#080808" />
  <title>YOYOJIN AR · Image Compare</title>
  <!-- A-Frame classic build: import-map/module 없이 모바일 호환성 우선 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    #ar-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #ar-container a-scene {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    #ar-container video,
    #ar-container > video {
      position: absolute !important;
      inset: 0 auto auto 0 !important;
      z-index: 0 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      object-fit: cover !important;
      background: #000 !important;
    }

    #ar-container canvas,
    #ar-container > canvas {
      position: absolute !important;
      z-index: 1 !important;
      pointer-events: none !important;
      background: transparent !important;
    }

    [hidden] { display: none !important; }

    .glass {
      color: #fff;
      background: rgba(12, 12, 12, 0.72);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 12px 40px rgba(0,0,0,0.30);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    /* ---------- START ---------- */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.08), transparent 38%),
        #080808;
      color: #fff;
    }

    #start-card {
      width: min(100%, 460px);
      text-align: center;
    }

    #brand {
      margin-bottom: 16px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      opacity: 0.72;
    }

    #start-card h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 7vw, 38px);
      line-height: 1.08;
    }

    #start-card p {
      margin: 0 auto 22px;
      max-width: 390px;
      color: rgba(255,255,255,0.70);
      font-size: 14px;
      line-height: 1.65;
    }

    #start-button {
      width: min(100%, 300px);
      min-height: 54px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
    }

    #start-button:disabled { opacity: 0.4; cursor: default; }

    #boot-status {
      min-height: 20px;
      margin-top: 14px;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      line-height: 1.45;
    }

    #debug-detail {
      margin-top: 6px;
      color: #ffabab;
      font-size: 11px;
      line-height: 1.4;
      word-break: break-word;
    }

    /* ---------- CAMERA HUD ---------- */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #status-pill {
      position: absolute;
      left: 50%;
      top: var(--safe-top);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 28px);
      padding: 9px 14px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,0.58);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      white-space: normal;
    }

    #scan-frame {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(66vw, 330px);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      opacity: 0.80;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    #scan-frame.detected {
      opacity: 0.24;
      transform: translate(-50%, -50%) scale(1.03);
    }

    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: rgba(255,255,255,0.94);
      border-style: solid;
    }
    .corner.tl { left:0; top:0; border-width:3px 0 0 3px; border-radius:12px 0 0 0; }
    .corner.tr { right:0; top:0; border-width:3px 3px 0 0; border-radius:0 12px 0 0; }
    .corner.bl { left:0; bottom:0; border-width:0 0 3px 3px; border-radius:0 0 0 12px; }
    .corner.br { right:0; bottom:0; border-width:0 3px 3px 0; border-radius:0 0 12px 0; }

    #scan-caption {
      position: absolute;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 6px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      text-align: center;
    }

    /* ---------- VIEWER ---------- */
    #viewer {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
      height: min(76dvh, 760px);
      min-height: 430px;
      overflow: hidden;
      border-radius: 26px;
      transform: translateY(calc(100% + 40px));
      opacity: 0;
      pointer-events: none;
      transition: transform 300ms cubic-bezier(.2,.75,.2,1), opacity 220ms ease;
    }

    #viewer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    #viewer-header {
      height: 68px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px 10px 17px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    #viewer-kicker {
      margin-bottom: 2px;
      color: rgba(255,255,255,0.52);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    #viewer-title {
      overflow: hidden;
      color: #fff;
      font-size: 16px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #close-viewer {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    #viewer-main {
      position: relative;
      height: calc(100% - 68px - 76px);
      overflow: hidden;
      background: rgba(0,0,0,0.66);
    }

    #slides {
      position: absolute;
      inset: 0;
      display: flex;
      width: 200%;
      height: 100%;
      transform: translateX(-50%);
      transition: transform 260ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }

    #slides.show-original { transform: translateX(0); }
    #slides.show-result { transform: translateX(-50%); }

    .slide {
      position: relative;
      width: 50%;
      height: 100%;
      flex: 0 0 50%;
      overflow: hidden;
    }

    .slide-label {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 5;
      padding: 7px 10px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,0.48);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
    }

    .image-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .image-stage:active { cursor: grabbing; }

    .zoom-image {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      max-width: 92%;
      max-height: 92%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: transform;
      pointer-events: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.30));
    }

    .image-error {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(84%, 360px);
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.70);
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    #viewer-footer {
      height: 76px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 11px 13px 12px;
      border-top: 1px solid rgba(255,255,255,0.10);
    }

    #tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      min-width: 0;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
    }

    .tab {
      min-width: 0;
      height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,0.64);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
    }

    .tab.active { background: #fff; color: #000; }

    #reset-zoom {
      height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    #gesture-hint {
      position: absolute;
      left: 50%;
      bottom: 10px;
      z-index: 7;
      transform: translateX(-50%);
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(0,0,0,0.42);
      color: rgba(255,255,255,0.72);
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 300ms ease;
    }

    #target-toast {
      position: fixed;
      left: 50%;
      top: calc(var(--safe-top) + 48px);
      z-index: 70;
      transform: translate(-50%, -12px);
      padding: 9px 13px;
      border-radius: 999px;
      color: #000;
      background: #fff;
      font-size: 12px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    #target-toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 760px) {
      #viewer {
        left: 50%;
        right: auto;
        width: min(760px, calc(100vw - 36px));
        transform: translate(-50%, calc(100% + 40px));
      }
      #viewer.open { transform: translate(-50%, 0); }
      #viewer-main { height: calc(100% - 68px - 80px); }
      #viewer-footer { height: 80px; }
    }
  </style>
</head>

<body>
  <div id="ar-container" aria-label="AR camera view">
    <a-scene
      id="ar-scene"
      embedded
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 3; missTolerance: 5; filterMinCF: 0.001; filterBeta: 20;"
      color-space="sRGB"
      renderer="colorManagement: true; alpha: true; antialias: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </div>

  <section id="start-screen">
    <div id="start-card">
      <div id="brand">YOYOJIN · ULSAN 2026</div>
      <h1>그림을 비춰 보세요</h1>
      <p>
        작품을 인식하면 연결된 이미지를 보여줍니다.<br>
        좌우 전환 · 두 손가락 확대/축소 · 확대 후 한 손가락 이동
      </p>
      <button id="start-button" type="button" disabled>준비 중…</button>
      <div id="boot-status">타깃 정보를 확인하고 있습니다…</div>
      <div id="debug-detail"></div>
    </div>
  </section>

  <div id="hud" hidden>
    <div id="status-pill">그림을 프레임 안에 비춰 주세요</div>
    <div id="scan-frame" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>
    <div id="scan-caption">다른 그림을 비추면 자동으로 다음 작품으로 바뀝니다</div>
  </div>

  <div id="target-toast">새 작품을 찾았습니다</div>

  <section id="viewer" class="glass" aria-label="작품 비교 뷰어">
    <header id="viewer-header">
      <div>
        <div id="viewer-kicker">IMAGE INTERACTION</div>
        <div id="viewer-title">작품</div>
      </div>
      <button id="close-viewer" type="button" aria-label="뷰어 닫기">×</button>
    </header>

    <main id="viewer-main">
      <div id="slides" class="show-result">
        <section class="slide" data-slide="original">
          <div class="slide-label">원본 · ORIGINAL</div>
          <div class="image-stage" id="stage-original">
            <img id="image-original" class="zoom-image" alt="원본 이미지" draggable="false" />
            <div id="error-original" class="image-error" hidden></div>
          </div>
        </section>

        <section class="slide" data-slide="result">
          <div class="slide-label">변환 이미지 · RESULT</div>
          <div class="image-stage" id="stage-result">
            <img id="image-result" class="zoom-image" alt="변환 이미지" draggable="false" />
            <div id="error-result" class="image-error" hidden></div>
          </div>
        </section>
      </div>
      <div id="gesture-hint">↔ 좌우 전환 · 두 손가락 확대 · 더블탭 초기화</div>
    </main>

    <footer id="viewer-footer">
      <div id="tabs" role="tablist" aria-label="이미지 선택">
        <button class="tab" id="tab-original" type="button">원본</button>
        <button class="tab active" id="tab-result" type="button">변환 이미지</button>
      </div>
      <button id="reset-zoom" type="button">크기 초기화</button>
    </footer>
  </section>

  <script>
    console.info("YOYOJIN AR BUILD: MULTI_IMAGE_COMPARE_AFRAME_V2_20260907");

    const CONFIG = Object.freeze({
      manifestUrl: "./targets.json",
      targetUrl: "./targets.mind",
      fallbackTargetCount: 3,
      cameraTimeoutMs: 15000,
      arTimeoutMs: 45000,
      maxTrack: 1,
      maxZoom: 5,
      minZoom: 1,
      swipeThresholdPx: 46,
      targetSwitchDebounceMs: 220
    });

    const $ = (selector) => document.querySelector(selector);

    const container = $("#ar-container");
    const sceneEl = $("#ar-scene");
    const startScreen = $("#start-screen");
    const startButton = $("#start-button");
    const bootStatus = $("#boot-status");
    const debugDetail = $("#debug-detail");
    const hud = $("#hud");
    const statusPill = $("#status-pill");
    const scanFrame = $("#scan-frame");
    const viewer = $("#viewer");
    const viewerTitle = $("#viewer-title");
    const closeViewerButton = $("#close-viewer");
    const slides = $("#slides");
    const tabOriginal = $("#tab-original");
    const tabResult = $("#tab-result");
    const resetZoomButton = $("#reset-zoom");
    const gestureHint = $("#gesture-hint");
    const targetToast = $("#target-toast");

    const originalImg = $("#image-original");
    const resultImg = $("#image-result");
    const originalError = $("#error-original");
    const resultError = $("#error-result");
    const originalStage = $("#stage-original");
    const resultStage = $("#stage-result");

    const state = {
      manifest: [],
      arSystem: null,
      anchors: [],
      sceneReady: false,
      started: false,
      starting: false,
      ready: false,
      targetBlobUrl: null,
      activeIndex: -1,
      activeId: null,
      currentSlide: "result",
      lastSwitchAt: 0,
      toastTimer: 0,
      hintTimer: 0
    };

    function setBoot(message) { bootStatus.textContent = message; }
    function setDebug(message = "") { debugDetail.textContent = message; }
    function setStatus(message) { statusPill.textContent = message; }

    function describeError(error) {
      if (!error) return "알 수 없는 오류";
      return `${error.name ? `${error.name}: ` : ""}${error.message || String(error)}`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function withTimeout(promise, milliseconds, message) {
      let timeoutId;
      const timeout = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          const error = new Error(message);
          error.name = "TimeoutError";
          reject(error);
        }, milliseconds);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timeoutId));
    }

    function numericId(value) {
      const match = String(value ?? "").match(/\d+/);
      return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
    }

    function fallbackManifest() {
      return Array.from({ length: CONFIG.fallbackTargetCount }, (_, index) => {
        const id = String(index + 1);
        return { id, target: `${id}.JPG`, result: `${id}.PNG`, title: `작품 #${id}` };
      });
    }

    async function loadManifest() {
      try {
        const response = await fetch(`${CONFIG.manifestUrl}?v=20260907`, { cache: "no-store" });
        if (!response.ok) throw new Error(`targets.json HTTP ${response.status}`);
        const json = await response.json();
        const rawItems = Array.isArray(json) ? json : json.items;
        if (!Array.isArray(rawItems) || rawItems.length === 0) {
          throw new Error("targets.json에 items가 없습니다.");
        }

        const items = rawItems
          .map((item, order) => ({
            id: String(item.id ?? order + 1),
            target: item.target || `${item.id ?? order + 1}.JPG`,
            result: item.result || `${item.id ?? order + 1}.PNG`,
            title: item.title || `작품 #${item.id ?? order + 1}`,
            targetIndex: Number.isInteger(item.targetIndex) ? item.targetIndex : order
          }))
          .sort((a, b) => a.targetIndex - b.targetIndex);

        // targetIndex는 0..N-1 연속이어야 합니다.
        items.forEach((item, index) => {
          if (item.targetIndex !== index) {
            throw new Error(`targets.json targetIndex가 연속적이지 않습니다. index ${index}`);
          }
        });
        return items;
      } catch (error) {
        console.warn("targets.json load failed; using fallback 1..3", error);
        setDebug("targets.json을 못 찾아 임시로 1~3번 설정을 사용합니다. 실제 운영 전 targets.json을 넣어 주세요.");
        return fallbackManifest();
      }
    }

    async function loadTargetBlobUrl() {
      setBoot("targets.mind를 불러오는 중입니다…");
      const response = await fetch(`${CONFIG.targetUrl}?v=20260907`, { cache: "default" });
      if (!response.ok) {
        throw new Error(`targets.mind를 찾지 못했습니다. HTTP ${response.status}`);
      }
      const data = await response.arrayBuffer();
      if (data.byteLength < 32) throw new Error("targets.mind 파일이 비어 있거나 올바르지 않습니다.");
      return URL.createObjectURL(new Blob([data], { type: "application/octet-stream" }));
    }

    function fixCameraLayers() {
      const video = container.querySelector("video");
      const canvases = container.querySelectorAll("canvas");
      if (video) {
        video.style.setProperty("z-index", "0", "important");
        video.style.setProperty("display", "block", "important");
        video.style.setProperty("visibility", "visible", "important");
        video.style.setProperty("opacity", "1", "important");
        video.style.setProperty("object-fit", "cover", "important");
      }
      canvases.forEach((canvas) => {
        canvas.style.setProperty("z-index", "1", "important");
        canvas.style.setProperty("pointer-events", "none", "important");
        canvas.style.setProperty("background", "transparent", "important");
      });
    }

    function waitForLiveVideo(video, timeoutMs) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let raf = 0;
        let timer = 0;

        const cleanup = () => {
          cancelAnimationFrame(raf);
          clearTimeout(timer);
          ["loadedmetadata", "loadeddata", "canplay", "playing"].forEach((name) => {
            video.removeEventListener(name, check);
          });
        };

        const finish = () => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve();
        };

        const fail = () => {
          if (settled) return;
          settled = true;
          cleanup();
          const error = new Error("카메라 권한은 허용됐지만 영상 연결이 완료되지 않았습니다.");
          error.name = "VideoMetadataTimeout";
          reject(error);
        };

        function check() {
          if (video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 1) {
            finish();
            return;
          }
          raf = requestAnimationFrame(check);
        }

        ["loadedmetadata", "loadeddata", "canplay", "playing"].forEach((name) => {
          video.addEventListener(name, check);
        });
        timer = setTimeout(fail, timeoutMs);
        check();
      });
    }

    async function startVideoRobust(mindar) {
      const video = document.createElement("video");
      mindar.video = video;
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("autoplay", "");
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.style.position = "absolute";
      video.style.left = "0";
      video.style.top = "0";
      container.appendChild(video);

      if (!navigator.mediaDevices?.getUserMedia) {
        const error = new Error("이 브라우저는 카메라 API를 지원하지 않습니다.");
        error.name = "NotSupportedError";
        throw error;
      }

      const stream = await withTimeout(
        navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        }),
        CONFIG.cameraTimeoutMs,
        "카메라 권한 응답 시간이 초과됐습니다."
      );

      video.srcObject = stream;
      try { await video.play(); } catch (error) { console.warn("video.play()", error); }
      await waitForLiveVideo(video, CONFIG.cameraTimeoutMs);
      video.width = video.videoWidth;
      video.height = video.videoHeight;
      fixCameraLayers();
    }

    function stopCameraTracks() {
      try {
        state.arSystem?.stop?.();
      } catch (error) {
        console.warn("AR stop warning", error);
      }
      document.querySelectorAll("video").forEach((video) => {
        const stream = video.srcObject;
        if (stream?.getTracks) stream.getTracks().forEach((track) => track.stop());
      });
    }

    function showToast(text) {
      clearTimeout(state.toastTimer);
      targetToast.textContent = text;
      targetToast.classList.add("show");
      state.toastTimer = setTimeout(() => targetToast.classList.remove("show"), 1200);
    }

    function showGestureHint() {
      clearTimeout(state.hintTimer);
      gestureHint.style.opacity = "1";
      state.hintTimer = setTimeout(() => { gestureHint.style.opacity = "0"; }, 3200);
    }

    function setSlide(name, { reset = false } = {}) {
      state.currentSlide = name === "original" ? "original" : "result";
      slides.classList.toggle("show-original", state.currentSlide === "original");
      slides.classList.toggle("show-result", state.currentSlide === "result");
      tabOriginal.classList.toggle("active", state.currentSlide === "original");
      tabResult.classList.toggle("active", state.currentSlide === "result");
      if (reset) resetCurrentZoom();
    }

    function clearImage(img, errorBox) {
      img.removeAttribute("src");
      img.style.opacity = "0";
      errorBox.hidden = true;
      errorBox.textContent = "";
    }

    function loadViewerImage(img, errorBox, url, label) {
      clearImage(img, errorBox);
      img.onload = () => {
        img.style.opacity = "1";
        errorBox.hidden = true;
      };
      img.onerror = () => {
        img.style.opacity = "0";
        errorBox.textContent = `${label} 파일을 불러오지 못했습니다.\n${url}`;
        errorBox.hidden = false;
      };
      // 브라우저 캐시를 그대로 활용. 인식된 작품의 2장만 네트워크에서 요청합니다.
      img.src = url;
    }

    function openViewerForTarget(index) {
      const item = state.manifest[index];
      if (!item) return;

      const now = performance.now();
      if (state.activeIndex === index && now - state.lastSwitchAt < CONFIG.targetSwitchDebounceMs) return;
      state.lastSwitchAt = now;
      state.activeIndex = index;
      state.activeId = item.id;

      viewerTitle.textContent = item.title || `작품 #${item.id}`;
      loadViewerImage(originalImg, originalError, item.target, "원본 이미지");
      loadViewerImage(resultImg, resultError, item.result, "변환 이미지");

      zoomControllers.original.reset(false);
      zoomControllers.result.reset(false);
      setSlide("result");

      viewer.classList.add("open");
      scanFrame.classList.add("detected");
      setStatus(`#${item.id} 인식 · 다른 그림을 비추면 자동 전환됩니다`);
      showToast(`#${item.id} 작품을 찾았습니다`);
      showGestureHint();
    }

    function handleTargetFound(index) {
      openViewerForTarget(index);
    }

    function handleTargetLost(index) {
      if (index !== state.activeIndex) return;
      // 일부러 뷰어를 닫지 않습니다. 관람객이 손을 움직이거나 확대해도 계속 볼 수 있습니다.
      scanFrame.classList.remove("detected");
      setStatus(`#${state.activeId ?? ""} 표시 중 · 다음 그림을 비춰 주세요`);
    }

    function closeViewer() {
      viewer.classList.remove("open");
      scanFrame.classList.remove("detected");
      setStatus("그림을 프레임 안에 비춰 주세요");
    }

    function createZoomController(stage, image, key) {
      const z = {
        scale: 1,
        x: 0,
        y: 0,
        pointers: new Map(),
        gestureMode: "none",
        startScale: 1,
        startX: 0,
        startY: 0,
        startDistance: 1,
        startCenterX: 0,
        startCenterY: 0,
        singleStartX: 0,
        singleStartY: 0,
        lastTapAt: 0
      };

      function limitPan() {
        if (z.scale <= 1.001) {
          z.x = 0;
          z.y = 0;
          return;
        }
        const rect = stage.getBoundingClientRect();
        const maxX = rect.width * 0.50 * (z.scale - 1) + 70;
        const maxY = rect.height * 0.50 * (z.scale - 1) + 70;
        z.x = clamp(z.x, -maxX, maxX);
        z.y = clamp(z.y, -maxY, maxY);
      }

      function render(animated = false) {
        image.style.transition = animated ? "transform 180ms ease" : "none";
        image.style.transform = `translate(calc(-50% + ${z.x}px), calc(-50% + ${z.y}px)) scale(${z.scale})`;
        if (animated) setTimeout(() => { image.style.transition = "none"; }, 190);
      }

      function reset(animated = true) {
        z.scale = 1;
        z.x = 0;
        z.y = 0;
        render(animated);
      }

      function prepareGesture() {
        const pts = [...z.pointers.values()];
        if (pts.length >= 2) {
          z.gestureMode = "pinch";
          const a = pts[0];
          const b = pts[1];
          z.startScale = z.scale;
          z.startX = z.x;
          z.startY = z.y;
          z.startDistance = Math.max(1, Math.hypot(b.x - a.x, b.y - a.y));
          z.startCenterX = (a.x + b.x) / 2;
          z.startCenterY = (a.y + b.y) / 2;
        } else if (pts.length === 1) {
          z.gestureMode = z.scale > 1.01 ? "pan" : "swipe";
          z.startX = z.x;
          z.startY = z.y;
          z.singleStartX = pts[0].x;
          z.singleStartY = pts[0].y;
        } else {
          z.gestureMode = "none";
        }
      }

      stage.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        stage.setPointerCapture?.(event.pointerId);
        z.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        const now = performance.now();
        if (z.pointers.size === 1 && now - z.lastTapAt < 290) {
          reset(true);
          z.lastTapAt = 0;
        } else if (z.pointers.size === 1) {
          z.lastTapAt = now;
        }
        prepareGesture();
      });

      stage.addEventListener("pointermove", (event) => {
        if (!z.pointers.has(event.pointerId)) return;
        event.preventDefault();
        z.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        const pts = [...z.pointers.values()];

        if (z.gestureMode === "pinch" && pts.length >= 2) {
          const a = pts[0];
          const b = pts[1];
          const distance = Math.max(1, Math.hypot(b.x - a.x, b.y - a.y));
          const centerX = (a.x + b.x) / 2;
          const centerY = (a.y + b.y) / 2;
          z.scale = clamp(z.startScale * (distance / z.startDistance), CONFIG.minZoom, CONFIG.maxZoom);
          z.x = z.startX + (centerX - z.startCenterX);
          z.y = z.startY + (centerY - z.startCenterY);
          limitPan();
          render(false);
          return;
        }

        if (z.gestureMode === "pan" && pts.length === 1) {
          z.x = z.startX + (pts[0].x - z.singleStartX);
          z.y = z.startY + (pts[0].y - z.singleStartY);
          limitPan();
          render(false);
        }
      });

      const finishPointer = (event) => {
        if (!z.pointers.has(event.pointerId)) return;
        event.preventDefault();
        const point = z.pointers.get(event.pointerId);
        const wasSwipe = z.gestureMode === "swipe" && z.pointers.size === 1;
        const dx = point.x - z.singleStartX;
        const dy = point.y - z.singleStartY;
        z.pointers.delete(event.pointerId);

        if (wasSwipe && Math.abs(dx) > CONFIG.swipeThresholdPx && Math.abs(dx) > Math.abs(dy) * 1.15) {
          if (dx < 0) setSlide("result");
          else setSlide("original");
        }
        prepareGesture();
      };

      stage.addEventListener("pointerup", finishPointer);
      stage.addEventListener("pointercancel", finishPointer);
      stage.addEventListener("lostpointercapture", (event) => {
        if (z.pointers.has(event.pointerId)) {
          z.pointers.delete(event.pointerId);
          prepareGesture();
        }
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.12 : 0.89;
        z.scale = clamp(z.scale * factor, CONFIG.minZoom, CONFIG.maxZoom);
        limitPan();
        render(false);
      }, { passive: false });

      return { reset, getState: () => ({ ...z }), key };
    }

    const zoomControllers = {
      original: createZoomController(originalStage, originalImg, "original"),
      result: createZoomController(resultStage, resultImg, "result")
    };

    function resetCurrentZoom() {
      zoomControllers[state.currentSlide]?.reset(true);
    }

    function waitForSceneLoaded(timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        if (!window.AFRAME) {
          reject(new Error("A-Frame 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요."));
          return;
        }
        if (!sceneEl) {
          reject(new Error("AR scene을 찾지 못했습니다."));
          return;
        }
        if (sceneEl.hasLoaded) {
          resolve();
          return;
        }
        let timer = 0;
        const done = () => {
          clearTimeout(timer);
          sceneEl.removeEventListener("loaded", done);
          resolve();
        };
        sceneEl.addEventListener("loaded", done, { once: true });
        timer = setTimeout(() => {
          sceneEl.removeEventListener("loaded", done);
          reject(new Error("AR 라이브러리 초기화 시간이 초과됐습니다."));
        }, timeoutMs);
      });
    }

    function createTargetEntities() {
      state.anchors.forEach((el) => el.remove());
      state.anchors = state.manifest.map((item, index) => {
        const entity = document.createElement("a-entity");
        entity.setAttribute("mindar-image-target", `targetIndex: ${index}`);
        entity.dataset.targetIndex = String(index);
        entity.addEventListener("targetFound", () => handleTargetFound(index));
        entity.addEventListener("targetLost", () => handleTargetLost(index));
        sceneEl.appendChild(entity);
        return entity;
      });
    }

    async function checkTargetMindExists() {
      // GitHub Pages에서 파일명/경로 실수를 시작 전에 잡아냅니다.
      const response = await fetch(`${CONFIG.targetUrl}?v=20260907b`, { cache: "no-store" });
      if (!response.ok) throw new Error(`targets.mind를 찾지 못했습니다. HTTP ${response.status}`);
      const data = await response.arrayBuffer();
      if (data.byteLength < 32) throw new Error("targets.mind 파일이 비어 있거나 올바르지 않습니다.");
      return data.byteLength;
    }

    async function initialize() {
      try {
        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          throw new Error("휴대폰 카메라는 HTTPS 주소에서만 실행할 수 있습니다.");
        }

        setDebug("");
        setBoot("AR 라이브러리를 확인하고 있습니다…");
        await waitForSceneLoaded();

        const arSystem = sceneEl.systems?.["mindar-image-system"];
        if (!arSystem) {
          throw new Error("MindAR 이미지 인식 모듈을 시작하지 못했습니다. 페이지를 새로고침해 주세요.");
        }
        state.arSystem = arSystem;
        state.sceneReady = true;

        setBoot("작품 목록을 확인하고 있습니다…");
        state.manifest = await loadManifest();

        setBoot(`${state.manifest.length}개 작품 정보 확인 · targets.mind 확인 중…`);
        const mindBytes = await checkTargetMindExists();
        console.info("targets.mind bytes:", mindBytes);

        createTargetEntities();

        state.ready = true;
        startButton.disabled = false;
        startButton.textContent = "카메라 시작";
        setBoot(`${state.manifest.length}개 작품 준비 완료 · 버튼을 눌러 주세요`);
      } catch (error) {
        console.error("Initialize failed", error);
        state.ready = false;
        startButton.disabled = true;
        startButton.textContent = "시작할 수 없음";
        setBoot("AR 파일을 준비하지 못했습니다.");
        setDebug(describeError(error));
      }
    }

    async function startAR() {
      if (!state.ready || state.started || state.starting || !state.arSystem) return;

      state.starting = true;
      startButton.disabled = true;
      startButton.textContent = "카메라 여는 중…";
      setBoot("카메라 권한을 요청하고 있습니다…");
      setDebug("");

      let readyTimer = 0;
      try {
        const readyPromise = new Promise((resolve, reject) => {
          const onReady = () => {
            cleanup();
            resolve();
          };
          const onError = (event) => {
            cleanup();
            const detail = event?.detail?.error || event?.detail || "카메라 또는 AR 엔진 오류";
            reject(detail instanceof Error ? detail : new Error(String(detail)));
          };
          const cleanup = () => {
            clearTimeout(readyTimer);
            sceneEl.removeEventListener("arReady", onReady);
            sceneEl.removeEventListener("arError", onError);
          };
          sceneEl.addEventListener("arReady", onReady, { once: true });
          sceneEl.addEventListener("arError", onError, { once: true });
          readyTimer = setTimeout(() => {
            cleanup();
            const error = new Error("카메라 또는 이미지 인식 엔진 준비 시간이 초과됐습니다.");
            error.name = "TimeoutError";
            reject(error);
          }, CONFIG.arTimeoutMs);
        });

        // 반드시 사용자 버튼 클릭 안에서 실행 -> 모바일 카메라 권한 창이 정상적으로 뜹니다.
        const maybePromise = state.arSystem.start();
        if (maybePromise?.catch) maybePromise.catch((error) => console.warn("MindAR start promise", error));
        await readyPromise;

        state.started = true;
        state.starting = false;
        startScreen.hidden = true;
        hud.hidden = false;
        setStatus("그림을 프레임 안에 비춰 주세요");
        fixCameraLayers();
        setTimeout(fixCameraLayers, 100);
        setTimeout(fixCameraLayers, 600);
      } catch (error) {
        clearTimeout(readyTimer);
        console.error("AR start failed", error);
        state.starting = false;
        state.started = false;
        stopCameraTracks();
        startScreen.hidden = false;
        startButton.disabled = false;
        startButton.textContent = "다시 시작";

        if (error?.name === "NotAllowedError") setBoot("카메라 권한이 차단되었습니다. 브라우저 설정에서 카메라를 허용해 주세요.");
        else if (error?.name === "NotFoundError") setBoot("사용할 수 있는 카메라를 찾지 못했습니다.");
        else if (error?.name === "NotReadableError") setBoot("다른 앱이 카메라를 사용 중이거나 카메라를 열 수 없습니다.");
        else if (error?.name === "TimeoutError") setBoot("카메라 또는 이미지 인식 엔진 준비 시간이 초과됐습니다.");
        else setBoot("AR 시작 중 오류가 발생했습니다.");
        setDebug(describeError(error));
      }
    }

    startButton.addEventListener("click", startAR);
    closeViewerButton.addEventListener("click", closeViewer);
    tabOriginal.addEventListener("click", () => setSlide("original"));
    tabResult.addEventListener("click", () => setSlide("result"));
    resetZoomButton.addEventListener("click", resetCurrentZoom);

    window.addEventListener("resize", () => requestAnimationFrame(fixCameraLayers));
    window.addEventListener("pagehide", stopCameraTracks);
    window.addEventListener("unhandledrejection", (event) => {
      console.error("Unhandled rejection", event.reason);
      setDebug(describeError(event.reason));
    });

    window.addEventListener("error", (event) => {
      if (!state.ready && !state.started) {
        const message = event?.message || "스크립트 로딩 오류";
        setDebug(message);
      }
    });

    // 외부 라이브러리가 실패해도 화면이 영원히 "준비 중"에 멈추지 않도록 안전장치.
    setTimeout(() => {
      if (!state.ready && startButton.textContent === "준비 중…") {
        setBoot("초기화가 지연되고 있습니다.");
        setDebug("페이지를 새로고침해도 같으면 A-Frame/MindAR 라이브러리 또는 targets.mind 경로를 확인해 주세요.");
      }
    }, 12000);

    initialize();
  </script>
</body>
</html>
