<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>MindAR GLB</title>

  <!-- MindAR 공식 권장 조합 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- GLB 안의 애니메이션 재생용 -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .mindar-ui-scanning {
      display: none !important;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: calc(100vw - 40px);
      padding: 9px 14px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: 14px/1.35 Arial, sans-serif;
      text-align: center;
      pointer-events: none;
    }
  </style>

  <script>
    /*
      첨부된 GLB는 원본 단위가 매우 크므로,
      로드 후 바운딩 박스를 계산해 자동 축소하고 중심을 맞춥니다.
    */
    AFRAME.registerComponent("fit-model", {
      schema: {
        targetSize: { type: "number", default: 0.9 }
      },

      init: function () {
        this.el.addEventListener("model-loaded", () => {
          const model = this.el.getObject3D("mesh");
          if (!model) return;

          model.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(model);
          if (box.isEmpty()) {
            console.error("GLB 바운딩 박스를 계산하지 못했습니다.");
            return;
          }

          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          const maxDimension = Math.max(size.x, size.y, size.z);
          if (!Number.isFinite(maxDimension) || maxDimension <= 0) return;

          const fittedScale = this.data.targetSize / maxDimension;

          /*
            월드 좌표 중심을 이 엔티티의 로컬 좌표로 바꾼 뒤
            GLB 루트만 이동합니다. 엔티티의 position 값은 유지됩니다.
          */
          const localCenter = this.el.object3D.worldToLocal(center.clone());
          model.position.sub(localCenter);

          /* 엔티티에서 전체 크기를 조절 */
          this.el.object3D.scale.setScalar(fittedScale);
          model.updateMatrixWorld(true);

          console.log("모델 자동 맞춤 완료", {
            size: size.toArray(),
            center: center.toArray(),
            fittedScale
          });
        });
      }
    });
  </script>
</head>

<body>
  <div id="status">카메라를 준비하는 중입니다…</div>

  <a-scene
    id="ar-scene"
    mindar-image="
      imageTargetSrc: ./1.mind?v=20260805-1;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 3;
      missTolerance: 5;
    "
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-light type="ambient" intensity="1.6"></a-light>
    <a-light type="directional" intensity="1.8" position="1 2 3"></a-light>

    <a-entity
      id="target-anchor"
      mindar-image-target="targetIndex: 0"
    >
      <!-- GLB가 준비되지 않았을 때만 보이는 이미지 -->
      <a-image
        id="loading-image"
        src="./detected.png?v=20260805-1"
        position="0 0 0.01"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false"
      ></a-image>

      <!--
        274KB GLB를 HTML에서 직접 로드합니다.
        scene의 loaded 이벤트를 기다리지 않으므로 로딩 함수가 누락되지 않습니다.
      -->
      <a-entity
        id="ar-model"
        gltf-model="url(./1.glb?v=20260805-1)"
        animation-mixer="clip: *; loop: repeat"
        fit-model="targetSize: 0.9"
        position="0 0 0.05"
        rotation="0 0 0"
        visible="false"
      ></a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("#ar-scene");
      const anchor = document.querySelector("#target-anchor");
      const model = document.querySelector("#ar-model");
      const loadingImage = document.querySelector("#loading-image");
      const status = document.querySelector("#status");

      let targetFound = false;
      let modelLoaded = Boolean(model.getObject3D("mesh"));
      let modelFailed = false;

      function setStatus(message, show = true) {
        status.textContent = message;
        status.style.display = show ? "block" : "none";
      }

      function renderState() {
        if (!targetFound) {
          loadingImage.setAttribute("visible", false);
          model.setAttribute("visible", false);

          if (modelFailed) {
            setStatus("3D 모델을 불러오지 못했습니다.");
          } else if (!modelLoaded) {
            setStatus("3D 모델을 준비하는 중입니다…");
          } else {
            setStatus("이미지를 카메라로 비춰 주세요.");
          }
          return;
        }

        if (modelLoaded) {
          loadingImage.setAttribute("visible", false);
          model.setAttribute("visible", true);
          setStatus("", false);
        } else {
          loadingImage.setAttribute("visible", true);
          model.setAttribute("visible", false);
          setStatus(
            modelFailed
              ? "3D 모델 로딩에 실패했습니다."
              : "3D 모델을 불러오는 중입니다…"
          );
        }
      }

      model.addEventListener("model-loaded", () => {
        console.log("1.glb 로딩 완료");
        modelLoaded = true;
        modelFailed = false;
        renderState();
      });

      model.addEventListener("model-error", (event) => {
        console.error("1.glb 로딩 실패", event.detail || event);
        modelLoaded = false;
        modelFailed = true;
        renderState();
      });

      anchor.addEventListener("targetFound", () => {
        console.log("타겟 발견");
        targetFound = true;
        renderState();
      });

      anchor.addEventListener("targetLost", () => {
        console.log("타겟 놓침");
        targetFound = false;
        renderState();
      });

      scene.addEventListener("arReady", () => {
        console.log("MindAR 준비 완료");
        renderState();
      });

      scene.addEventListener("arError", (event) => {
        console.error("MindAR 오류", event);
        setStatus("카메라 권한 또는 1.mind 파일을 확인해 주세요.");
      });

      /* 이벤트 등록 전에 GLB가 이미 로드됐을 가능성도 처리 */
      if (model.getObject3D("mesh")) {
        modelLoaded = true;
      }

      renderState();
    });
  </script>
</body>
</html>
