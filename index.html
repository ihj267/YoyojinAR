<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>MindAR Camera Fix</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      /* 중요: 검은 배경을 넣으면 뒤쪽 카메라 영상이 가려질 수 있음 */
      background: transparent !important;
    }

    /* MindAR가 body에 생성하는 실제 카메라 영상 */
    body > video {
      position: fixed !important;
      z-index: 0 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      object-fit: cover !important;
    }

    /* AR 장면은 카메라 영상 위에 투명하게 배치 */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    .a-canvas {
      z-index: 1 !important;
      background: transparent !important;
    }

    .mindar-ui-scanning {
      display: none !important;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      max-width: calc(100vw - 40px);
      padding: 9px 14px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      font: 14px/1.35 Arial, sans-serif;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>

  <script>
    /* 모델의 가장 긴 축을 타겟 너비 정도로 자동 조절하고 중심을 맞춤 */
    AFRAME.registerComponent("fit-model", {
      schema: {
        targetSize: { type: "number", default: 0.9 }
      },

      init: function () {
        this.el.addEventListener("model-loaded", () => {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          this.el.object3D.scale.set(1, 1, 1);
          mesh.position.set(0, 0, 0);
          mesh.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(mesh);
          if (box.isEmpty()) return;

          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          const maxDimension = Math.max(size.x, size.y, size.z);
          if (!Number.isFinite(maxDimension) || maxDimension <= 0) return;

          const fittedScale = this.data.targetSize / maxDimension;

          /* 모델 자체를 원점으로 옮긴 뒤 엔티티 전체를 축소 */
          mesh.position.set(-center.x, -center.y, -center.z);
          this.el.object3D.scale.setScalar(fittedScale);
          mesh.updateMatrixWorld(true);

          console.log("모델 크기 자동 조절 완료", {
            size: size.toArray(),
            center: center.toArray(),
            fittedScale
          });
        });
      }
    });
  </script>
</head>

<body>
  <div id="status">카메라를 준비하는 중입니다…</div>

  <a-scene
    id="ar-scene"
    mindar-image="
      imageTargetSrc: ./1.mind?v=20260805-2;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 3;
      missTolerance: 5;
    "
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/;"
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets timeout="15000">
      <a-asset-item
        id="model-asset"
        src="./1.glb?v=20260805-2"
      ></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" intensity="1.4" position="1 2 3"></a-light>

    <a-entity
      id="target-anchor"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity
        id="ar-model"
        gltf-model="#model-asset"
        animation-mixer="clip: *; loop: repeat"
        fit-model="targetSize: 0.9"
        position="0 0 0.05"
        rotation="0 0 0"
      ></a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("#ar-scene");
      const anchor = document.querySelector("#target-anchor");
      const model = document.querySelector("#ar-model");
      const status = document.querySelector("#status");

      function setStatus(message, visible = true) {
        status.textContent = message;
        status.style.display = visible ? "block" : "none";
      }

      /*
        MindAR가 카메라 video를 뒤쪽 음수 z-index로 생성합니다.
        생성 직후와 화면 회전 후에도 video/canvas 층을 강제로 바로잡습니다.
      */
      function fixCameraLayers() {
        const videos = document.querySelectorAll("body > video");
        const canvas = document.querySelector(".a-canvas");

        videos.forEach((video) => {
          video.style.setProperty("z-index", "0", "important");
          video.style.setProperty("display", "block", "important");
          video.style.setProperty("visibility", "visible", "important");
          video.style.setProperty("opacity", "1", "important");
        });

        if (canvas) {
          canvas.style.setProperty("z-index", "1", "important");
          canvas.style.setProperty("background", "transparent", "important");
        }
      }

      const observer = new MutationObserver(fixCameraLayers);
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      scene.addEventListener("renderstart", () => {
        fixCameraLayers();
      });

      scene.addEventListener("arReady", () => {
        fixCameraLayers();
        setStatus("인식 이미지를 카메라로 비춰 주세요.");
      });

      scene.addEventListener("arError", (event) => {
        console.error("MindAR 오류", event);
        setStatus("카메라 또는 1.mind 파일을 확인해 주세요.");
      });

      model.addEventListener("model-loaded", () => {
        console.log("1.glb 로딩 완료");
      });

      model.addEventListener("model-error", (event) => {
        console.error("1.glb 로딩 실패", event.detail || event);
        setStatus("1.glb 모델을 불러오지 못했습니다.");
      });

      anchor.addEventListener("targetFound", () => {
        setStatus("", false);
      });

      anchor.addEventListener("targetLost", () => {
        setStatus("인식 이미지를 카메라로 비춰 주세요.");
      });

      window.addEventListener("resize", () => {
        requestAnimationFrame(fixCameraLayers);
      });

      /* 카메라 video가 조금 늦게 생성되는 모바일 브라우저 대비 */
      [0, 100, 300, 700, 1500, 3000].forEach((delay) => {
        window.setTimeout(fixCameraLayers, delay);
      });
    });
  </script>
</body>
</html>
