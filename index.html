<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* 거슬리는 스캔 UI 숨김 */
      .mindar-ui-scanning { display: none !important; }
    </style>
  </head>
  <body>
    <!-- 1.mind(원본 1.jpg)를 타겟으로 설정 -->
    <a-scene mindar-image="imageTargetSrc: ./1.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 3D 모델 대신 테스트용 이미지 로드 -->
        <img id="test-img" src="./detected.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        
        <!-- 인식되었을 때 나타날 2D 이미지 설정 (2배 크기) -->
        <a-image 
          id="ar-image"
          src="#test-img" 
          position="0 0 0" 
          scale="2 2 2"
          visible="false"
          animation="property: material.opacity; to: 0; dur: 800; startEvents: fadeout">
        </a-image>
        
      </a-entity>
    </a-scene>

    <script>
      const anchor = document.querySelector('#target-anchor');
      const arImage = document.querySelector('#ar-image');
      let isTriggered = false;

      // 이미지가 디텍트(인식) 되었을 때 실행
      anchor.addEventListener("targetFound", event => {
        if (isTriggered) return;
        isTriggered = true;

        // 1. 이미지를 즉시 띄우고 투명도를 100%로 설정
        arImage.setAttribute('visible', true);
        arImage.setAttribute('material', 'opacity', 1.0);

        // 2. 2초(2000ms) 유지 후 페이드아웃 시작
        setTimeout(() => {
          arImage.emit('fadeout');
          
          // 3. 페이드아웃(0.8초) 완료 후 숨김 처리
          setTimeout(() => {
            arImage.setAttribute('visible', false);
            isTriggered = false; 
          }, 800);
        }, 2000);
      });
    </script>
  </body>
</html>
