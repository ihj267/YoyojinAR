<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <!-- 손가락 터치(이동, 확대/축소)를 인식하는 외부 라이브러리 -->
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  </head>
  <body>
    <!-- gesture-detector를 추가하여 화면 터치를 감지하도록 설정 -->
    <a-scene mindar-image="imageTargetSrc: ./1.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" gesture-detector>
      
      <a-assets>
        <!-- 3D 모델 불러오기 -->
        <a-asset-item id="my-model" src="./1.glb"></a-asset-item>
      </a-assets>

      <!-- 카메라 설정: 터치할 수 있는 객체(.clickable)를 인식하도록 레이캐스터 설정 -->
      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          class="clickable" : 터치 조작이 가능하도록 이름표 부여
          scale="2 2 2" : 초기 크기 2배
          gesture-handler : 손가락 조작 기능 활성화 (최소 스케일 1, 최대 6)
        -->
        <a-entity 
          gltf-model="#my-model"
          class="clickable"
          position="0 0 0" 
          scale="2 2 2"
          gesture-handler="minScale: 1; maxScale: 6">
        </a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
