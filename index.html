<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <title>이미지 AR · TOUCH PHOTO V11</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #ar-container > video {
      position: absolute !important;
      inset: 0 auto auto 0 !important;
      z-index: 0 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      object-fit: cover !important;
      background: transparent !important;
    }

    #ar-container > canvas {
      position: absolute !important;
      z-index: 1 !important;
      background: transparent !important;
      pointer-events: none !important;
    }

    .panel {
      position: fixed;
      z-index: 20;
      color: #fff;
      background: rgba(12, 12, 12, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px;
      color: #fff;
      text-align: center;
      background: #0b0b0b;
    }

    #start-screen[hidden],
    #status[hidden],
    #toolbar[hidden],
    #rotation-pad[hidden],
    #photo-preview[hidden] {
      display: none !important;
    }

    #version-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 11px;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 999px;
      color: #fff;
      background: rgba(255,255,255,0.1);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #start-screen h1 {
      margin: 0;
      font-size: 22px;
    }

    #start-screen p {
      max-width: 420px;
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      line-height: 1.55;
    }

    #start-button {
      min-width: 190px;
      min-height: 50px;
      margin-top: 8px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #000;
      background: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #start-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    #boot-status {
      min-height: 20px;
      max-width: 420px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      line-height: 1.5;
    }

    #debug-detail {
      min-height: 18px;
      max-width: 420px;
      color: rgba(255, 170, 170, 0.9);
      font-size: 11px;
      line-height: 1.4;
      word-break: break-word;
    }

    #status {
      left: 50%;
      top: max(18px, env(safe-area-inset-top));
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1.3;
      text-align: center;
      white-space: normal;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    #toolbar {
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 999px;
    }

    #capture-button {
      position: relative;
      width: 64px;
      height: 64px;
      padding: 0;
      justify-self: center;
      border: 3px solid #fff;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    #capture-button::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #fff;
      transition: transform 100ms ease;
    }

    #capture-button:active::after {
      transform: scale(0.86);
    }

    #capture-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    #rotation-pad {
      right: max(16px, env(safe-area-inset-right));
      bottom: max(108px, calc(env(safe-area-inset-bottom) + 96px));
      width: 152px;
      height: 152px;
      border-radius: 28px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    #rotation-pad.active {
      background: rgba(18, 18, 18, 0.84);
      border-color: rgba(255, 255, 255, 0.24);
    }

    #rotation-pad-z-ring,
    #rotation-pad-ring,
    #rotation-pad-cross {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #rotation-pad-z-ring {
      width: 138px;
      height: 138px;
      border: 2px dashed rgba(255, 255, 255, 0.34);
      border-radius: 50%;
    }

    #rotation-pad.z-active #rotation-pad-z-ring {
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.92);
    }

    #rotation-pad-ring {
      width: 108px;
      height: 108px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    #rotation-pad-cross {
      width: 90px;
      height: 90px;
    }

    #rotation-pad-cross::before,
    #rotation-pad-cross::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255,255,255,0.18);
      transform: translate(-50%, -50%);
    }

    #rotation-pad-cross::before {
      width: 1px;
      height: 90px;
    }

    #rotation-pad-cross::after {
      width: 90px;
      height: 1px;
    }

    .rotation-arrow {
      position: absolute;
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .rotation-arrow.up { left: 50%; top: 14px; transform: translateX(-50%); }
    .rotation-arrow.down { left: 50%; bottom: 14px; transform: translateX(-50%); }
    .rotation-arrow.left { left: 14px; top: 50%; transform: translateY(-50%); }
    .rotation-arrow.right { right: 14px; top: 50%; transform: translateY(-50%); }
    .rotation-arrow.up-left { left: 23px; top: 23px; }
    .rotation-arrow.up-right { right: 23px; top: 23px; }
    .rotation-arrow.down-left { left: 23px; bottom: 23px; }
    .rotation-arrow.down-right { right: 23px; bottom: 23px; }

    #rotation-pad-handle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.18);
      box-shadow: 0 4px 16px rgba(0,0,0,0.28);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 80ms ease;
    }

    #rotation-pad-axis-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      font-weight: 800;
      color: rgba(255,255,255,0.64);
      pointer-events: none;
    }

    #rotation-pad-z-label {
      position: absolute;
      right: 9px;
      top: 9px;
      padding: 3px 5px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
      color: rgba(255,255,255,0.82);
      background: rgba(0,0,0,0.28);
      pointer-events: none;
    }

    #rotation-pad.z-active #rotation-pad-z-label {
      color: #000;
      background: #fff;
    }

    #rotation-pad-note {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    #photo-preview {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.94);
    }

    #photo-preview img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 120px);
      border-radius: 14px;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.42);
    }

    #preview-actions {
      display: flex;
      gap: 10px;
      width: min(100%, 420px);
    }

    #preview-actions button {
      flex: 1;
      min-height: 46px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #save-photo-button {
      border: 0;
      color: #000;
      background: #fff;
    }

    #close-preview-button {
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body>
  <div id="ar-container" aria-label="AR camera view"></div>

  <section id="start-screen">
    <div id="version-badge">TOUCH · PHOTO · V11</div>
    <h1>이미지 AR</h1>
    <p>
      한 손가락 이동 · 두 손가락 확대/축소 · 오른쪽 XYZ 회전 패드, 타깃 이탈 후 5초 유지, AR 사진 촬영 버전입니다.
      카메라 권한 창이 뜨면 허용해 주세요.
    </p>
    <button id="start-button" type="button" disabled>준비 중…</button>
    <div id="boot-status">파일을 확인하는 중입니다…</div>
    <div id="debug-detail"></div>
  </section>

  <div id="status" class="panel" hidden>인식 이미지를 비춰 주세요.</div>

  <aside id="rotation-pad" class="panel" aria-label="XYZ 회전 컨트롤" hidden>
    <div id="rotation-pad-z-ring"></div>
    <div id="rotation-pad-ring"></div>
    <div id="rotation-pad-cross"></div>
    <div class="rotation-arrow up">▲</div>
    <div class="rotation-arrow down">▼</div>
    <div class="rotation-arrow left">◀</div>
    <div class="rotation-arrow right">▶</div>
    <div class="rotation-arrow up-left">↖</div>
    <div class="rotation-arrow up-right">↗</div>
    <div class="rotation-arrow down-left">↙</div>
    <div class="rotation-arrow down-right">↘</div>
    <div id="rotation-pad-handle"></div>
    <div id="rotation-pad-axis-label">X · Y</div>
    <div id="rotation-pad-z-label">Z ↻</div>
    <div id="rotation-pad-note">XYZ ROTATE</div>
  </aside>

  <nav id="toolbar" class="panel" aria-label="AR controls" hidden>
    <button id="capture-button" type="button" aria-label="사진 촬영"></button>
  </nav>

  <section id="photo-preview" hidden>
    <img id="preview-image" alt="촬영한 AR 사진 미리보기" />
    <div id="preview-actions">
      <button id="close-preview-button" type="button">닫기</button>
      <button id="save-photo-button" type="button">저장·공유</button>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { MindARThree } from "mindar-image-three";

    console.info("AR BUILD: TOUCH_PHOTO_V11_20260814");

    const CONFIG = Object.freeze({
      targetUrl: "./1.mind",
      modelUrl: "./1.glb",
      fitHeight: 1.0,
      baseOffsetX: 0,
      baseOffsetY: 0,
      baseOffsetZ: 0.025,
      rotationX: 0,
      rotationY: 0,
      rotationZ: 0,
      minUserScale: 0.2,
      maxUserScale: 4.0,
      moveRange: 2.5,
      targetHoldMs: 5000,
      cameraTimeoutMs: 15000,
      arTimeoutMs: 35000,
      captureMaxDimension: 1920,
      smoothingPositionResponse: 8,
      smoothingRotationResponse: 10,
      smoothingScaleResponse: 8,
      rotationDegreesPerPixel: 0.42
    });

    const container = document.querySelector("#ar-container");
    const startScreen = document.querySelector("#start-screen");
    const startButton = document.querySelector("#start-button");
    const bootStatus = document.querySelector("#boot-status");
    const debugDetail = document.querySelector("#debug-detail");
    const status = document.querySelector("#status");
    const toolbar = document.querySelector("#toolbar");
    const rotationPad = document.querySelector("#rotation-pad");
    const rotationPadHandle = document.querySelector("#rotation-pad-handle");
    const captureButton = document.querySelector("#capture-button");
    const photoPreview = document.querySelector("#photo-preview");
    const previewImage = document.querySelector("#preview-image");
    const closePreviewButton = document.querySelector("#close-preview-button");
    const savePhotoButton = document.querySelector("#save-photo-button");

    const state = {
      started: false,
      starting: false,
      modelReady: false,
      baseScale: 1,
      userScale: 1,
      userOffsetX: 0,
      userOffsetY: 0,
      userRotationX: 0,
      userRotationY: 0,
      userRotationZ: 0,
      smoothingEnabled: true,
      hasPose: false,
      targetSeenOnce: false,
      lastTargetSeenAt: 0,
      holdUntil: 0,
      trackingLastFrame: false,
      modelHolder: null,
      displayRoot: null,
      mixer: null,
      primaryAction: null,
      mindar: null,
      anchor: null,
      targetBlobUrl: null,
      currentPhotoBlob: null,
      currentPhotoUrl: null,
      clock: null
    };

    const pose = {
      targetPosition: new THREE.Vector3(),
      targetQuaternion: new THREE.Quaternion(),
      targetScale: new THREE.Vector3(),
      currentPosition: new THREE.Vector3(),
      currentQuaternion: new THREE.Quaternion(),
      currentScale: new THREE.Vector3(1, 1, 1)
    };

    const gesture = {
      pointers: new Map(),
      mode: 0,
      startCentroidX: 0,
      startCentroidY: 0,
      startDistance: 1,
      startOffsetX: 0,
      startOffsetY: 0,
      startScale: 1
    };

    const rotationPadState = {
      active: false,
      pointerId: null,
      mode: "xy",
      centerX: 0,
      centerY: 0,
      startClientX: 0,
      startClientY: 0,
      startAngle: 0,
      startRotationX: 0,
      startRotationY: 0,
      startRotationZ: 0
    };

    function setBootMessage(message) {
      bootStatus.textContent = message;
    }

    function setDebug(message = "") {
      debugDetail.textContent = message;
    }

    function setStatus(message, visible = true) {
      status.textContent = message;
      status.hidden = !visible;
    }

    function describeError(error) {
      if (!error) return "알 수 없는 오류";
      const name = error.name ? `${error.name}: ` : "";
      return `${name}${error.message || String(error)}`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizeAngleDegrees(value) {
      let result = value % 360;
      if (result > 180) result -= 360;
      if (result < -180) result += 360;
      return result;
    }

    function withTimeout(promise, milliseconds, message) {
      let timeoutId;
      const timeout = new Promise((_, reject) => {
        timeoutId = window.setTimeout(() => {
          const error = new Error(message);
          error.name = "TimeoutError";
          reject(error);
        }, milliseconds);
      });

      return Promise.race([promise, timeout]).finally(() => {
        window.clearTimeout(timeoutId);
      });
    }

    function stopCameraTracks() {
      const video = state.mindar?.video;
      const stream = video?.srcObject;
      if (stream && typeof stream.getTracks === "function") {
        stream.getTracks().forEach((track) => track.stop());
      }
    }

    function fixCameraLayers() {
      const video = container.querySelector("video");
      const canvases = container.querySelectorAll("canvas");

      if (video) {
        video.style.setProperty("z-index", "0", "important");
        video.style.setProperty("display", "block", "important");
        video.style.setProperty("visibility", "visible", "important");
        video.style.setProperty("opacity", "1", "important");
        video.style.setProperty("object-fit", "cover", "important");
      }

      canvases.forEach((canvas) => {
        canvas.style.setProperty("z-index", "1", "important");
        canvas.style.setProperty("background", "transparent", "important");
        canvas.style.setProperty("pointer-events", "none", "important");
      });
    }

    function waitForLiveVideo(video, timeoutMs) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let animationFrameId = 0;
        let timeoutId = 0;

        const cleanup = () => {
          window.cancelAnimationFrame(animationFrameId);
          window.clearTimeout(timeoutId);
          video.removeEventListener("loadedmetadata", check);
          video.removeEventListener("loadeddata", check);
          video.removeEventListener("canplay", check);
          video.removeEventListener("playing", check);
        };

        const finish = () => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve();
        };

        const fail = () => {
          if (settled) return;
          settled = true;
          cleanup();
          const error = new Error("카메라 스트림은 허용됐지만 영상 크기를 받지 못했습니다.");
          error.name = "VideoMetadataTimeout";
          reject(error);
        };

        function check() {
          if (video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 1) {
            finish();
            return;
          }
          animationFrameId = window.requestAnimationFrame(check);
        }

        video.addEventListener("loadedmetadata", check);
        video.addEventListener("loadeddata", check);
        video.addEventListener("canplay", check);
        video.addEventListener("playing", check);
        timeoutId = window.setTimeout(fail, timeoutMs);
        check();
      });
    }

    async function startVideoRobust(mindar) {
      const video = document.createElement("video");
      mindar.video = video;

      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("autoplay", "");
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.style.position = "absolute";
      video.style.top = "0";
      video.style.left = "0";
      video.style.zIndex = "0";

      container.appendChild(video);

      if (!navigator.mediaDevices?.getUserMedia) {
        const error = new Error("이 브라우저는 카메라 API를 지원하지 않습니다.");
        error.name = "NotSupportedError";
        throw error;
      }

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      setBootMessage("카메라 권한을 확인하고 있습니다…");
      const stream = await withTimeout(
        navigator.mediaDevices.getUserMedia(constraints),
        CONFIG.cameraTimeoutMs,
        "카메라 권한 응답 시간이 초과됐습니다."
      );

      video.srcObject = stream;

      try {
        await video.play();
      } catch (error) {
        console.warn("video.play() was not immediately available", error);
      }

      await waitForLiveVideo(video, CONFIG.cameraTimeoutMs);

      video.width = video.videoWidth;
      video.height = video.videoHeight;
      video.setAttribute("width", String(video.videoWidth));
      video.setAttribute("height", String(video.videoHeight));

      fixCameraLayers();
      startScreen.hidden = true;
      setStatus("카메라 연결 완료 · 이미지 인식 엔진을 준비하고 있습니다…");
    }

    function updateModelTransform() {
      if (!state.modelHolder) return;

      const finalScale = state.baseScale * state.userScale;
      state.modelHolder.scale.setScalar(finalScale);
      state.modelHolder.position.set(
        CONFIG.baseOffsetX + state.userOffsetX,
        CONFIG.baseOffsetY + state.userOffsetY,
        CONFIG.baseOffsetZ
      );
      state.modelHolder.rotation.set(
        THREE.MathUtils.degToRad(CONFIG.rotationX + state.userRotationX),
        THREE.MathUtils.degToRad(CONFIG.rotationY + state.userRotationY),
        THREE.MathUtils.degToRad(CONFIG.rotationZ + state.userRotationZ)
      );
    }

    function resetModelTransform() {
      state.userScale = 1;
      state.userOffsetX = 0;
      state.userOffsetY = 0;
      state.userRotationX = 0;
      state.userRotationY = 0;
      state.userRotationZ = 0;
      updateModelTransform();
      showTemporaryStatus("크기·위치·회전을 처음 상태로 되돌렸습니다.", 1300);
    }

    let temporaryStatusTimer = 0;
    function showTemporaryStatus(message, duration = 1800) {
      window.clearTimeout(temporaryStatusTimer);
      setStatus(message);
      temporaryStatusTimer = window.setTimeout(() => {
        if (!state.started) return;
        if (state.anchor?.visible) {
          setStatus("", false);
        } else if (performance.now() < state.holdUntil) {
          setStatus("타깃을 놓쳤습니다 · 마지막 위치에서 5초간 유지합니다.");
        } else {
          setStatus("인식 이미지를 비춰 주세요.");
        }
      }, duration);
    }

    function resetRotationPadHandle() {
      rotationPadHandle.style.transform = "translate(-50%, -50%)";
    }

    function syncRotationPadVisibility() {
      const visible = Boolean(
        state.started &&
        state.displayRoot?.visible &&
        photoPreview.hidden
      );
      rotationPad.hidden = !visible;
      if (!visible) {
        rotationPad.classList.remove("active", "z-active");
        rotationPadState.active = false;
        rotationPadState.pointerId = null;
        resetRotationPadHandle();
      }
    }

    function prepareGestureBaseline() {
      const points = [...gesture.pointers.values()];
      gesture.mode = points.length >= 2 ? 2 : points.length;
      gesture.startOffsetX = state.userOffsetX;
      gesture.startOffsetY = state.userOffsetY;
      gesture.startScale = state.userScale;

      if (points.length === 1) {
        gesture.startCentroidX = points[0].x;
        gesture.startCentroidY = points[0].y;
        return;
      }

      if (points.length >= 2) {
        const first = points[0];
        const second = points[1];
        gesture.startCentroidX = (first.x + second.x) / 2;
        gesture.startCentroidY = (first.y + second.y) / 2;
        gesture.startDistance = Math.max(1, Math.hypot(second.x - first.x, second.y - first.y));
      }
    }

    function applyGesture() {
      if (!state.started || !state.hasPose || !state.displayRoot?.visible) return;

      const points = [...gesture.pointers.values()];
      if (points.length === 0) return;

      const movementUnit = 1.55 / Math.max(320, Math.min(container.clientWidth, container.clientHeight));

      if (points.length === 1 && gesture.mode === 1) {
        const point = points[0];
        const dx = point.x - gesture.startCentroidX;
        const dy = point.y - gesture.startCentroidY;

        state.userOffsetX = clamp(
          gesture.startOffsetX + dx * movementUnit,
          -CONFIG.moveRange,
          CONFIG.moveRange
        );
        state.userOffsetY = clamp(
          gesture.startOffsetY - dy * movementUnit,
          -CONFIG.moveRange,
          CONFIG.moveRange
        );
        updateModelTransform();
        return;
      }

      if (points.length >= 2 && gesture.mode === 2) {
        const first = points[0];
        const second = points[1];
        const distance = Math.max(1, Math.hypot(second.x - first.x, second.y - first.y));
        const scaleRatio = distance / gesture.startDistance;

        state.userScale = clamp(
          gesture.startScale * scaleRatio,
          CONFIG.minUserScale,
          CONFIG.maxUserScale
        );
        updateModelTransform();
      }
    }

    function updateRotationPadHandle(clientX, clientY, mode = rotationPadState.mode) {
      const rect = rotationPad.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rawX = clientX - centerX;
      const rawY = clientY - centerY;
      const distance = Math.max(0.001, Math.hypot(rawX, rawY));

      if (mode === "z") {
        const radius = 64;
        const x = (rawX / distance) * radius;
        const y = (rawY / distance) * radius;
        rotationPadHandle.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        return;
      }

      const maxRadius = 42;
      const ratio = distance > maxRadius ? maxRadius / distance : 1;
      const x = rawX * ratio;
      const y = rawY * ratio;
      rotationPadHandle.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    }

    function connectRotationPad() {
      const releaseRotationPad = (event) => {
        if (event && rotationPadState.pointerId !== event.pointerId) return;
        rotationPadState.active = false;
        rotationPadState.pointerId = null;
        rotationPad.classList.remove("active", "z-active");
        resetRotationPadHandle();
      };

      rotationPad.addEventListener("pointerdown", (event) => {
        if (!state.started || !state.displayRoot?.visible || photoPreview.hidden === false) return;
        event.preventDefault();
        event.stopPropagation();

        const rect = rotationPad.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dxCenter = event.clientX - centerX;
        const dyCenter = event.clientY - centerY;
        const radiusFromCenter = Math.hypot(dxCenter, dyCenter);
        const mode = radiusFromCenter >= 54 ? "z" : "xy";

        rotationPad.setPointerCapture?.(event.pointerId);
        rotationPadState.active = true;
        rotationPadState.pointerId = event.pointerId;
        rotationPadState.mode = mode;
        rotationPadState.centerX = centerX;
        rotationPadState.centerY = centerY;
        rotationPadState.startClientX = event.clientX;
        rotationPadState.startClientY = event.clientY;
        rotationPadState.startAngle = Math.atan2(dyCenter, dxCenter);
        rotationPadState.startRotationX = state.userRotationX;
        rotationPadState.startRotationY = state.userRotationY;
        rotationPadState.startRotationZ = state.userRotationZ;

        rotationPad.classList.add("active");
        rotationPad.classList.toggle("z-active", mode === "z");
        updateRotationPadHandle(event.clientX, event.clientY, mode);
        showTemporaryStatus(
          mode === "z"
            ? "Z축 회전 · 바깥 링을 원형으로 돌리세요"
            : "X/Y축 회전 · 안쪽 패드를 상하좌우로 움직이세요",
          1100
        );
      });

      rotationPad.addEventListener("pointermove", (event) => {
        if (!rotationPadState.active || rotationPadState.pointerId !== event.pointerId) return;
        event.preventDefault();
        event.stopPropagation();

        if (rotationPadState.mode === "z") {
          const currentAngle = Math.atan2(
            event.clientY - rotationPadState.centerY,
            event.clientX - rotationPadState.centerX
          );
          let angleDelta = THREE.MathUtils.radToDeg(currentAngle - rotationPadState.startAngle);
          if (angleDelta > 180) angleDelta -= 360;
          if (angleDelta < -180) angleDelta += 360;
          state.userRotationZ = normalizeAngleDegrees(
            rotationPadState.startRotationZ + angleDelta
          );
        } else {
          const dx = event.clientX - rotationPadState.startClientX;
          const dy = event.clientY - rotationPadState.startClientY;
          state.userRotationY = normalizeAngleDegrees(
            rotationPadState.startRotationY + dx * CONFIG.rotationDegreesPerPixel
          );
          state.userRotationX = normalizeAngleDegrees(
            rotationPadState.startRotationX + dy * CONFIG.rotationDegreesPerPixel
          );
        }

        updateModelTransform();
        updateRotationPadHandle(event.clientX, event.clientY, rotationPadState.mode);
      });

      rotationPad.addEventListener("pointerup", (event) => {
        event.preventDefault();
        event.stopPropagation();
        releaseRotationPad(event);
      });
      rotationPad.addEventListener("pointercancel", (event) => {
        event.preventDefault();
        event.stopPropagation();
        releaseRotationPad(event);
      });
      rotationPad.addEventListener("lostpointercapture", releaseRotationPad);
    }

    function connectGestures() {
      container.addEventListener("pointerdown", (event) => {
        if (!state.started || photoPreview.hidden === false) return;
        event.preventDefault();
        container.setPointerCapture?.(event.pointerId);
        gesture.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        prepareGestureBaseline();
      });

      container.addEventListener("pointermove", (event) => {
        if (!gesture.pointers.has(event.pointerId)) return;
        event.preventDefault();
        gesture.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        applyGesture();
      });

      const removePointer = (event) => {
        if (!gesture.pointers.has(event.pointerId)) return;
        event.preventDefault();
        gesture.pointers.delete(event.pointerId);
        prepareGestureBaseline();
      };

      container.addEventListener("pointerup", removePointer);
      container.addEventListener("pointercancel", removePointer);
      container.addEventListener("lostpointercapture", removePointer);
    }

    async function loadTargetAsBlobUrl(url) {
      setBootMessage("1.mind 파일을 확인하는 중입니다…");
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`1.mind 파일을 찾지 못했습니다. HTTP ${response.status}`);
      }

      const data = await response.arrayBuffer();
      if (data.byteLength < 32) {
        throw new Error("1.mind 파일이 비어 있거나 올바르지 않습니다.");
      }

      return URL.createObjectURL(
        new Blob([data], { type: "application/octet-stream" })
      );
    }

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath(
          "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
        );

        const manager = new THREE.LoadingManager();
        manager.onError = (resourceUrl) => {
          console.error("GLB resource load failed:", resourceUrl);
          setDebug(`3D 맵핑 파일을 불러오지 못했습니다: ${resourceUrl}`);
        };

        const loader = new GLTFLoader(manager);
        loader.setDRACOLoader(dracoLoader);
        loader.setCrossOrigin("anonymous");

        const resolvedUrl = new URL(url, window.location.href);
        const resourceBase = resolvedUrl.href.slice(0, resolvedUrl.href.lastIndexOf("/") + 1);
        loader.setResourcePath(resourceBase);

        loader.load(
          resolvedUrl.href,
          (gltf) => {
            dracoLoader.dispose();
            resolve(gltf);
          },
          (event) => {
            if (!event.total) return;
            const percentage = Math.round((event.loaded / event.total) * 100);
            setBootMessage(`1.glb를 불러오는 중입니다… ${percentage}%`);
          },
          (error) => {
            dracoLoader.dispose();
            reject(error);
          }
        );
      });
    }

    function prepareModel(gltf) {
      const root = gltf.scene;

      root.traverse((object) => {
        if (!object.isMesh) return;
        object.frustumCulled = false;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.filter(Boolean).forEach((material) => {
          const colorMaps = [material.map, material.emissiveMap].filter(Boolean);
          colorMaps.forEach((texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.flipY = false;
            texture.needsUpdate = true;
          });

          [
            material.normalMap,
            material.roughnessMap,
            material.metalnessMap,
            material.aoMap,
            material.alphaMap,
            material.bumpMap
          ].filter(Boolean).forEach((texture) => {
            texture.flipY = false;
            texture.needsUpdate = true;
          });

          material.needsUpdate = true;
        });
      });

      const mappedMeshes = [];
      root.traverse((object) => {
        if (!object.isMesh) return;
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        const maps = materials.filter(Boolean).flatMap((material) => [
          material.map, material.normalMap, material.roughnessMap, material.metalnessMap,
          material.emissiveMap, material.aoMap, material.alphaMap, material.bumpMap
        ]).filter(Boolean);
        if (maps.length > 0) mappedMeshes.push({ name: object.name || "(unnamed)", maps: maps.length });
      });
      console.info("GLB texture mapping:", mappedMeshes.length > 0 ? mappedMeshes : "No texture maps found in GLB");
      if (mappedMeshes.length === 0) {
        setDebug("GLB 안에서 텍스처 맵을 찾지 못했습니다. Blender에서 텍스처를 GLB에 포함(Embed)해 내보냈는지 확인해 주세요.");
      }

      if (gltf.animations.length > 0) {
        state.mixer = new THREE.AnimationMixer(root);
        const action = state.mixer.clipAction(gltf.animations[0]);
        action.reset();
        action.enabled = true;
        action.clampWhenFinished = false;
        action.setLoop(THREE.LoopPingPong, Infinity);
        action.repetitions = Infinity;
        action.zeroSlopeAtStart = true;
        action.zeroSlopeAtEnd = true;
        action.play();
        state.primaryAction = action;
        state.mixer.setTime(0);
      }

      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root, true);
      if (box.isEmpty()) {
        throw new Error("GLB의 표시 영역을 계산할 수 없습니다.");
      }

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("GLB 높이 계산값이 올바르지 않습니다.");
      }

      state.baseScale = CONFIG.fitHeight / size.y;

      root.position.x -= center.x;
      root.position.y -= center.y;
      root.position.z -= box.min.z;

      const holder = new THREE.Group();
      holder.name = "ARModelHolder";
      holder.add(root);

      state.modelHolder = holder;
      updateModelTransform();

      console.info("AR model fitted", {
        measuredSize: size.toArray(),
        measuredCenter: center.toArray(),
        baseScale: state.baseScale,
        animations: gltf.animations.length
      });

      return holder;
    }

    function copyTrackedPoseImmediately() {
      if (!state.anchor || !state.displayRoot) return;

      state.anchor.group.matrix.decompose(
        pose.currentPosition,
        pose.currentQuaternion,
        pose.currentScale
      );
      pose.targetPosition.copy(pose.currentPosition);
      pose.targetQuaternion.copy(pose.currentQuaternion);
      pose.targetScale.copy(pose.currentScale);

      state.displayRoot.position.copy(pose.currentPosition);
      state.displayRoot.quaternion.copy(pose.currentQuaternion);
      state.displayRoot.scale.copy(pose.currentScale);
      state.hasPose = true;
    }

    function updateTrackedPose(delta, now) {
      if (!state.anchor || !state.displayRoot) return;

      const tracking = Boolean(state.anchor.visible);

      if (tracking) {
        state.anchor.group.matrix.decompose(
          pose.targetPosition,
          pose.targetQuaternion,
          pose.targetScale
        );

        if (!state.hasPose || (!state.trackingLastFrame && now > state.holdUntil)) {
          copyTrackedPoseImmediately();
        } else if (state.smoothingEnabled) {
          const positionAlpha = 1 - Math.exp(-CONFIG.smoothingPositionResponse * delta);
          const rotationAlpha = 1 - Math.exp(-CONFIG.smoothingRotationResponse * delta);
          const scaleAlpha = 1 - Math.exp(-CONFIG.smoothingScaleResponse * delta);

          pose.currentPosition.lerp(pose.targetPosition, positionAlpha);
          pose.currentQuaternion.slerp(pose.targetQuaternion, rotationAlpha);
          pose.currentScale.lerp(pose.targetScale, scaleAlpha);

          state.displayRoot.position.copy(pose.currentPosition);
          state.displayRoot.quaternion.copy(pose.currentQuaternion);
          state.displayRoot.scale.copy(pose.currentScale);
        } else {
          pose.currentPosition.copy(pose.targetPosition);
          pose.currentQuaternion.copy(pose.targetQuaternion);
          pose.currentScale.copy(pose.targetScale);

          state.displayRoot.position.copy(pose.targetPosition);
          state.displayRoot.quaternion.copy(pose.targetQuaternion);
          state.displayRoot.scale.copy(pose.targetScale);
        }

        state.lastTargetSeenAt = now;
        state.holdUntil = now + CONFIG.targetHoldMs;
        state.displayRoot.visible = true;
      } else if (state.hasPose && now <= state.holdUntil) {
        state.displayRoot.visible = true;
      } else {
        state.displayRoot.visible = false;
      }

      state.trackingLastFrame = tracking;
    }

    function getCaptureDimensions() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      const maxDimension = Math.max(width, height);
      const scale = Math.min(
        window.devicePixelRatio || 1,
        CONFIG.captureMaxDimension / maxDimension
      );

      return {
        width: Math.max(1, Math.round(width * scale)),
        height: Math.max(1, Math.round(height * scale))
      };
    }

    function drawCameraFrame(context, outputWidth, outputHeight) {
      const video = state.mindar?.video;
      if (!video || video.videoWidth <= 0 || video.videoHeight <= 0) {
        throw new Error("촬영할 카메라 영상을 찾지 못했습니다.");
      }

      const containerRect = container.getBoundingClientRect();
      const videoRect = video.getBoundingClientRect();
      const scaleX = outputWidth / containerRect.width;
      const scaleY = outputHeight / containerRect.height;

      const drawX = (videoRect.left - containerRect.left) * scaleX;
      const drawY = (videoRect.top - containerRect.top) * scaleY;
      const drawWidth = videoRect.width * scaleX;
      const drawHeight = videoRect.height * scaleY;

      context.drawImage(video, drawX, drawY, drawWidth, drawHeight);
    }

    function renderAROverlayCanvas(outputWidth, outputHeight) {
      const { renderer, scene, camera } = state.mindar;
      const target = new THREE.WebGLRenderTarget(outputWidth, outputHeight, {
        format: THREE.RGBAFormat,
        type: THREE.UnsignedByteType,
        depthBuffer: true,
        stencilBuffer: false
      });
      target.texture.colorSpace = THREE.SRGBColorSpace;

      const previousTarget = renderer.getRenderTarget();
      const previousClearColor = renderer.getClearColor(new THREE.Color());
      const previousClearAlpha = renderer.getClearAlpha();
      const pixels = new Uint8Array(outputWidth * outputHeight * 4);

      try {
        renderer.setRenderTarget(target);
        renderer.setClearColor(0x000000, 0);
        renderer.clear(true, true, true);
        renderer.render(scene, camera);
        renderer.readRenderTargetPixels(
          target,
          0,
          0,
          outputWidth,
          outputHeight,
          pixels
        );
      } finally {
        renderer.setRenderTarget(previousTarget);
        renderer.setClearColor(previousClearColor, previousClearAlpha);
        target.dispose();
      }

      const flipped = new Uint8ClampedArray(pixels.length);
      const rowLength = outputWidth * 4;
      for (let sourceY = 0; sourceY < outputHeight; sourceY += 1) {
        const targetY = outputHeight - sourceY - 1;
        const sourceStart = sourceY * rowLength;
        const targetStart = targetY * rowLength;
        flipped.set(pixels.subarray(sourceStart, sourceStart + rowLength), targetStart);
      }

      const overlayCanvas = document.createElement("canvas");
      overlayCanvas.width = outputWidth;
      overlayCanvas.height = outputHeight;
      const overlayContext = overlayCanvas.getContext("2d", { alpha: true });
      if (!overlayContext) {
        throw new Error("AR 사진 합성용 캔버스를 만들지 못했습니다.");
      }
      overlayContext.putImageData(
        new ImageData(flipped, outputWidth, outputHeight),
        0,
        0
      );

      return overlayCanvas;
    }

    function canvasToBlob(canvas, type = "image/jpeg", quality = 0.93) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) {
            reject(new Error("사진 파일을 만들지 못했습니다."));
            return;
          }
          resolve(blob);
        }, type, quality);
      });
    }

    async function capturePhoto() {
      if (!state.started || !state.mindar) return;

      captureButton.disabled = true;
      showTemporaryStatus("사진을 만드는 중입니다…", 3000);

      try {
        const { width, height } = getCaptureDimensions();
        const captureCanvas = document.createElement("canvas");
        captureCanvas.width = width;
        captureCanvas.height = height;

        const context = captureCanvas.getContext("2d", {
          alpha: false,
          desynchronized: true
        });
        if (!context) {
          throw new Error("사진 합성용 캔버스를 만들지 못했습니다.");
        }

        drawCameraFrame(context, width, height);
        const overlayCanvas = renderAROverlayCanvas(width, height);
        context.drawImage(overlayCanvas, 0, 0, width, height);

        const blob = await canvasToBlob(captureCanvas);

        if (state.currentPhotoUrl) {
          URL.revokeObjectURL(state.currentPhotoUrl);
        }

        state.currentPhotoBlob = blob;
        state.currentPhotoUrl = URL.createObjectURL(blob);
        previewImage.src = state.currentPhotoUrl;
        photoPreview.hidden = false;
        syncRotationPadVisibility();
        setStatus("", false);
      } catch (error) {
        console.error("Photo capture failed", error);
        showTemporaryStatus(`촬영 실패: ${error.message || error}`, 2500);
      } finally {
        captureButton.disabled = false;
      }
    }

    function makePhotoFileName() {
      const now = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      return `AR_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.jpg`;
    }

    async function saveOrSharePhoto() {
      if (!state.currentPhotoBlob) return;

      const fileName = makePhotoFileName();
      const file = new File([state.currentPhotoBlob], fileName, {
        type: "image/jpeg"
      });

      try {
        if (navigator.share && navigator.canShare?.({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: "AR 사진"
          });
          return;
        }

        const link = document.createElement("a");
        link.href = state.currentPhotoUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
      } catch (error) {
        if (error?.name !== "AbortError") {
          console.error("Photo save failed", error);
          showTemporaryStatus("사진 저장에 실패했습니다. 이미지를 길게 눌러 저장해 주세요.", 2600);
        }
      }
    }

    function closePhotoPreview() {
      photoPreview.hidden = true;
      syncRotationPadVisibility();
      if (state.anchor?.visible) {
        setStatus("", false);
      } else if (performance.now() < state.holdUntil) {
        setStatus("타깃을 놓쳤습니다 · 마지막 위치에서 5초간 유지합니다.");
      } else {
        setStatus("인식 이미지를 비춰 주세요.");
      }
    }

    async function initialize() {
      try {
        if (!window.isSecureContext && location.hostname !== "localhost") {
          throw new Error("카메라는 HTTPS 주소에서만 실행할 수 있습니다.");
        }

        setDebug("");

        const targetBlobUrl = await loadTargetAsBlobUrl(CONFIG.targetUrl);
        state.targetBlobUrl = targetBlobUrl;

        const gltf = await loadGLB(`${CONFIG.modelUrl}?v=20260814-touch-photo-v11`);

        const mindar = new MindARThree({
          container,
          imageTargetSrc: targetBlobUrl,
          maxTrack: 1,
          uiLoading: "no",
          uiScanning: "no",
          uiError: "no",
          warmupTolerance: 3,
          missTolerance: 5,
          filterMinCF: 0.001,
          filterBeta: 20
        });

        state.mindar = mindar;

        const { renderer, scene } = mindar;
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.4));

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
        keyLight.position.set(1.5, 2.5, 3);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
        fillLight.position.set(-2, 1, 1.5);
        scene.add(fillLight);

        const anchor = mindar.addAnchor(0);
        state.anchor = anchor;

        const displayRoot = new THREE.Group();
        displayRoot.name = "StabilizedDisplayRoot";
        displayRoot.visible = false;
        state.displayRoot = displayRoot;
        scene.add(displayRoot);

        const holder = prepareModel(gltf);
        displayRoot.add(holder);

        anchor.onTargetFound = () => {
          const now = performance.now();
          const wasNeverSeen = !state.targetSeenOnce;
          state.targetSeenOnce = true;
          state.lastTargetSeenAt = now;
          state.holdUntil = now + CONFIG.targetHoldMs;

          if (wasNeverSeen) {
            showTemporaryStatus(
              "한 손가락 이동 · 두 손가락 스케일 · 오른쪽 XYZ 회전 패드",
              3000
            );
          } else {
            setStatus("", false);
          }
        };

        anchor.onTargetLost = () => {
          state.holdUntil = performance.now() + CONFIG.targetHoldMs;
          setStatus("타깃을 놓쳤습니다 · 마지막 위치에서 5초간 유지합니다.");
        };

        connectGestures();
        connectRotationPad();

        captureButton.addEventListener("click", capturePhoto);
        closePreviewButton.addEventListener("click", closePhotoPreview);
        savePhotoButton.addEventListener("click", saveOrSharePhoto);

        state.modelReady = true;
        startButton.disabled = false;
        startButton.textContent = "카메라 시작";
        setBootMessage("1.mind와 1.glb 확인 완료");
      } catch (error) {
        console.error(error);
        startButton.disabled = true;
        startButton.textContent = "시작할 수 없음";
        setBootMessage("시작 파일을 준비하지 못했습니다.");
        setDebug(describeError(error));
      }
    }

    async function startAR() {
      if (state.started || state.starting || !state.modelReady || !state.mindar) return;

      state.starting = true;
      startButton.disabled = true;
      startButton.textContent = "카메라 여는 중…";
      setDebug("");

      try {
        await startVideoRobust(state.mindar);

        setStatus("카메라 연결 완료 · 1.mind를 초기화하고 있습니다…");

        await withTimeout(
          state.mindar._startAR(),
          CONFIG.arTimeoutMs,
          "카메라는 연결됐지만 1.mind 인식 엔진 초기화가 완료되지 않았습니다."
        );

        state.started = true;
        state.starting = false;

        fixCameraLayers();
        window.setTimeout(fixCameraLayers, 100);
        window.setTimeout(fixCameraLayers, 500);

        toolbar.hidden = false;
        syncRotationPadVisibility();
        setStatus("인식 이미지를 비춰 주세요.");

        const clock = new THREE.Clock();
        state.clock = clock;
        const { renderer, scene, camera } = state.mindar;

        renderer.setAnimationLoop(() => {
          const delta = Math.min(clock.getDelta(), 0.05);
          const now = performance.now();

          if (state.mixer) state.mixer.update(delta);
          updateTrackedPose(delta, now);
          syncRotationPadVisibility();

          if (
            state.targetSeenOnce &&
            !state.anchor.visible &&
            now > state.holdUntil &&
            state.displayRoot.visible === false &&
            photoPreview.hidden &&
            status.textContent !== "인식 이미지를 비춰 주세요."
          ) {
            setStatus("인식 이미지를 비춰 주세요.");
          }

          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error("AR start failed", error);
        state.starting = false;
        stopCameraTracks();

        startScreen.hidden = false;
        startButton.disabled = false;
        startButton.textContent = "다시 시작";
        setStatus("", false);

        if (error?.name === "NotAllowedError") {
          setBootMessage("카메라 권한이 차단되었습니다.");
        } else if (error?.name === "NotFoundError") {
          setBootMessage("사용할 수 있는 카메라를 찾지 못했습니다.");
        } else if (error?.name === "NotReadableError") {
          setBootMessage("다른 앱이 카메라를 사용 중이거나 카메라를 열 수 없습니다.");
        } else if (error?.name === "VideoMetadataTimeout") {
          setBootMessage("권한은 허용됐지만 카메라 영상 연결이 완료되지 않았습니다.");
        } else if (error?.name === "TimeoutError") {
          setBootMessage("카메라 또는 이미지 인식 엔진의 준비 시간이 초과됐습니다.");
        } else {
          setBootMessage("AR 시작 중 오류가 발생했습니다.");
        }

        setDebug(describeError(error));
      }
    }

    startButton.addEventListener("click", startAR);

    window.addEventListener("resize", () => {
      window.requestAnimationFrame(fixCameraLayers);
    });

    window.addEventListener("pagehide", stopCameraTracks);

    window.addEventListener("unhandledrejection", (event) => {
      console.error("Unhandled promise rejection", event.reason);
      setDebug(describeError(event.reason));
    });

    initialize();
  </script>
</body>
</html>
