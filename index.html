<body>

<section id="start"><div class="start-card"><div class="brand">YOYOJIN · ULSAN 2026</div><h1>벽화 속 친구를<br>찾아보세요</h1><p>벽화의 캐릭터를 카메라로 비추면<br>그 캐릭터가 태어난 아이의 원본 그림을 볼 수 있습니다.</p><button id="startBtn" disabled>준비 중…</button><div id="boot">AR을 준비하고 있습니다…</div><div id="debug"></div></div></section>

<script>
(()=>{'use strict';
const BUILD='YOYOJIN_ULSAN_AR_FINAL_V4_20260907';
const CFG={manifest:'./targets.json',maxZoom:6,minZoom:1,swipe:48,sceneTimeout:16000,arTimeout:45000,debounce:180};
const $=s=>document.querySelector(s),scene=$('#ar-scene'),wrap=$('#ar-wrap'),start=$('#start'),startBtn=$('#startBtn'),boot=$('#boot'),debug=$('#debug'),hud=$('#hud'),status=$('#status'),viewer=$('#viewer'),title=$('#title'),slides=$('#slides'),art=$('#artwork'),marker=$('#marker'),ea=$('#errArtwork'),em=$('#errMarker'),la=$('#loadArtwork'),lm=$('#loadMarker'),sa=$('#stageArtwork'),sm=$('#stageMarker'),tabA=$('#tabArtwork'),tabM=$('#tabMarker'),reset=$('#reset'),expand=$('#expand'),close=$('#close'),toast=$('#toast'),hint=$('#hint');

async function manifest(){const r=await fetch(CFG.manifest+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('targets.json HTTP '+r.status);const d=await r.json();const x=(Array.isArray(d)?d:d.items||[]).slice().sort((a,b)=>(a.targetIndex??0)-(b.targetIndex??0));if(!x.length)throw new Error('targets.json이 비어 있습니다.');x.forEach((it,i)=>{if((it.targetIndex??i)!==i)throw new Error('targetIndex 오류: '+i);if(!(it.marker||it.target))throw new Error(i+'번 marker 없음');if(!(it.artwork||it.result))throw new Error(i+'번 artwork 없음')});return x.map((it,i)=>({id:String(it.id??i+1),targetIndex:i,marker:it.marker||it.target,artwork:it.artwork||it.result,title:it.title||('작품 '+(i+1))}))}
async function checkFile(url,label){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(label+' HTTP '+r.status);const b=await r.arrayBuffer();if(b.byteLength<32)throw new Error(label+' 파일이 비어 있습니다.');return b.byteLength}

function openTarget(i){const it=state.items[i];if(!it)return;const n=performance.now();if(state.active===i&&n-state.last<CFG.debounce)return;state.last=n;state.active=i;title.textContent=it.title+' · #'+it.id;loadImg(art,ea,la,it.artwork,'원본 그림');loadImg(marker,em,lm,it.marker,'벽화 캐릭터');zoomA.reset(false);zoomM.reset(false);setSlide('artwork');viewer.classList.add('open');document.body.classList.add('viewer-open');setStatus('#'+it.id+' 인식 · 위쪽 카메라로 다음 캐릭터를 계속 찾을 수 있어요');showToast('#'+it.id+' 원본 그림을 찾았습니다');showHint()}
function zoomController(stage,img){const z={scale:1,x:0,y:0,p:new Map(),mode:'none',ss:1,sx:0,sy:0,sd:1,scx:0,scy:0,px:0,py:0,lastTap:0};function limit(){if(z.scale<=1.001){z.x=z.y=0;return}const r=stage.getBoundingClientRect();z.x=clamp(z.x,-r.width*.55*(z.scale-1)-60,r.width*.55*(z.scale-1)+60);z.y=clamp(z.y,-r.height*.55*(z.scale-1)-60,r.height*.55*(z.scale-1)+60)}function render(anim=false){img.style.transition=anim?'transform .18s ease':'none';img.style.transform=`translate(calc(-50% + ${z.x}px),calc(-50% + ${z.y}px)) scale(${z.scale})`;if(anim)setTimeout(()=>img.style.transition='none',190)}function resetZ(anim=true){z.scale=1;z.x=z.y=0;render(anim)}function prep(){const p=[...z.p.values()];if(p.length>=2){z.mode='pinch';const a=p[0],b=p[1];z.ss=z.scale;z.sx=z.x;z.sy=z.y;z.sd=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));z.scx=(a.x+b.x)/2;z.scy=(a.y+b.y)/2}else if(p.length===1){z.mode=z.scale>1.01?'pan':'swipe';z.sx=z.x;z.sy=z.y;z.px=p[0].x;z.py=p[0].y}else z.mode='none'}stage.addEventListener('pointerdown',e=>{e.preventDefault();stage.setPointerCapture?.(e.pointerId);z.p.set(e.pointerId,{x:e.clientX,y:e.clientY});const n=performance.now();if(z.p.size===1&&n-z.lastTap<290){resetZ(true);z.lastTap=0}else if(z.p.size===1)z.lastTap=n;prep()});stage.addEventListener('pointermove',e=>{if(!z.p.has(e.pointerId))return;e.preventDefault();z.p.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...z.p.values()];if(z.mode==='pinch'&&p.length>=2){const a=p[0],b=p[1],d=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;z.scale=clamp(z.ss*d/z.sd,CFG.minZoom,CFG.maxZoom);z.x=z.sx+cx-z.scx;z.y=z.sy+cy-z.scy;limit();render()}else if(z.mode==='pan'&&p.length===1){z.x=z.sx+p[0].x-z.px;z.y=z.sy+p[0].y-z.py;limit();render()}});const finish=e=>{if(!z.p.has(e.pointerId))return;e.preventDefault();const p=z.p.get(e.pointerId),was=z.mode==='swipe'&&z.p.size===1,dx=p.x-z.px,dy=p.y-z.py;z.p.delete(e.pointerId);if(was&&Math.abs(dx)>CFG.swipe&&Math.abs(dx)>Math.abs(dy)*1.15)setSlide(dx<0?'marker':'artwork');prep()};stage.addEventListener('pointerup',finish);stage.addEventListener('pointercancel',finish);stage.addEventListener('lostpointercapture',e=>{z.p.delete(e.pointerId);prep()});return{reset:resetZ,limit:()=>{limit();render()}}}
const zoomA=zoomController(sa,art),zoomM=zoomController(sm,marker);

})();
