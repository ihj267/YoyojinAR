<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>YOYOJIN · ULSAN 2026 AR</title>

  <!-- MindAR 공식 A-Frame 방식: GitHub Pages 같은 정적 호스팅에서 사용 가능 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Pretendard, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --viewer-h: min(70dvh, 690px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; overscroll-behavior:none; }
    body { touch-action:none; }
    button { font:inherit; }
    [hidden] { display:none !important; }

    /* ---------- AR / CAMERA ---------- */
    #ar-wrap { position:fixed; inset:0; overflow:hidden; background:#000; isolation:isolate; }
    #ar-scene { position:absolute !important; inset:0 !important; width:100% !important; height:100% !important; z-index:1 !important; }
    #ar-wrap video { position:absolute !important; z-index:0 !important; display:block !important; visibility:visible !important; opacity:1 !important; object-fit:cover !important; background:#000 !important; }
    #ar-wrap canvas { position:absolute !important; z-index:1 !important; pointer-events:none !important; background:transparent !important; }

    /* ---------- START ---------- */
    #start-screen {
      position:fixed; inset:0; z-index:1000; display:grid; place-items:center;
      padding:26px; color:#fff; text-align:center;
      background:radial-gradient(circle at 50% 32%, #202020 0, #0d0d0d 36%, #050505 72%);
    }
    #start-card { width:min(100%, 440px); }
    .brand { margin-bottom:18px; font-size:11px; font-weight:850; letter-spacing:.22em; color:rgba(255,255,255,.63); }
    #start-card h1 { margin:0 0 12px; font-size:clamp(29px, 8vw, 42px); line-height:1.08; letter-spacing:-.035em; }
    #start-card p { margin:0 auto 24px; max-width:360px; color:rgba(255,255,255,.69); font-size:14px; line-height:1.65; }
    #start-button {
      width:min(100%, 310px); min-height:56px; border:0; border-radius:999px;
      color:#050505; background:#fff; font-size:16px; font-weight:900; cursor:pointer;
      box-shadow:0 12px 32px rgba(0,0,0,.34);
    }
    #start-button:disabled { opacity:.35; cursor:default; }
    #boot-status { min-height:18px; margin-top:14px; font-size:12px; line-height:1.5; color:rgba(255,255,255,.66); }
    #debug-detail { min-height:16px; margin-top:7px; color:#ffaaaa; font-size:11px; line-height:1.45; word-break:break-word; }

    /* ---------- HUD ---------- */
    #hud { position:fixed; inset:0; z-index:20; pointer-events:none; transition:opacity .2s ease; }
    #status-pill {
      position:absolute; left:50%; top:var(--safe-top); transform:translateX(-50%);
      max-width:calc(100vw - 28px); padding:9px 13px; border-radius:999px;
      color:#fff; background:rgba(0,0,0,.56); border:1px solid rgba(255,255,255,.13);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      font-size:12px; font-weight:800; text-align:center; white-space:normal;
    }
    #scan-frame {
      position:absolute; left:50%; top:45%; width:min(68vw, 320px); aspect-ratio:1/1;
      transform:translate(-50%,-50%); transition:top .28s ease,width .28s ease,opacity .2s ease,transform .2s ease;
    }
    .scan-corner { position:absolute; width:36px; height:36px; border-style:solid; border-color:#fff; filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
    .scan-corner.tl { left:0; top:0; border-width:3px 0 0 3px; border-radius:13px 0 0 0; }
    .scan-corner.tr { right:0; top:0; border-width:3px 3px 0 0; border-radius:0 13px 0 0; }
    .scan-corner.bl { left:0; bottom:0; border-width:0 0 3px 3px; border-radius:0 0 0 13px; }
    .scan-corner.br { right:0; bottom:0; border-width:0 3px 3px 0; border-radius:0 0 13px 0; }
    #scan-note {
      position:absolute; left:50%; bottom:calc(var(--safe-bottom) + 5px); transform:translateX(-50%);
      width:max-content; max-width:calc(100vw - 34px); padding:8px 12px; border-radius:999px;
      background:rgba(0,0,0,.46); color:rgba(255,255,255,.87); font-size:11px; text-align:center;
      transition:opacity .2s ease;
    }
    body.viewer-open #scan-frame { top:15%; width:min(31vw, 132px); opacity:.72; }
    body.viewer-open #scan-note { opacity:0; }

    /* ---------- VIEWER ---------- */
    #viewer {
      position:fixed; left:8px; right:8px; bottom:calc(7px + env(safe-area-inset-bottom));
      z-index:100; height:var(--viewer-h); overflow:hidden; border-radius:26px;
      background:rgba(14,14,14,.97); border:1px solid rgba(255,255,255,.14);
      box-shadow:0 -12px 48px rgba(0,0,0,.48); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      transform:translateY(calc(100% + 40px)); opacity:0; pointer-events:none;
      transition:transform .3s cubic-bezier(.2,.78,.2,1),opacity .2s ease,height .25s ease;
    }
    #viewer.open { transform:translateY(0); opacity:1; pointer-events:auto; }
    #viewer.expanded { height:calc(100dvh - var(--safe-top) - 8px); }

    #sheet-handle { width:44px; height:4px; margin:8px auto 0; border-radius:999px; background:rgba(255,255,255,.28); }
    #viewer-header {
      height:62px; display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:6px 11px 8px 15px; border-bottom:1px solid rgba(255,255,255,.09);
    }
    #viewer-heading { min-width:0; }
    #viewer-kicker { margin-bottom:2px; color:rgba(255,255,255,.48); font-size:9px; font-weight:900; letter-spacing:.15em; }
    #viewer-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fff; font-size:16px; font-weight:900; }
    #header-actions { display:flex; gap:6px; }
    .round-btn {
      width:40px; height:40px; padding:0; border-radius:50%; border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.07); color:#fff; display:grid; place-items:center; cursor:pointer; font-weight:800;
    }
    #close-viewer { font-size:22px; }
    #expand-viewer { font-size:17px; }

    #viewer-body { height:calc(100% - 74px - 64px); min-height:0; position:relative; background:#0a0a0a; overflow:hidden; }
    #slides { position:absolute; inset:0; display:flex; width:200%; height:100%; transform:translateX(0); transition:transform .25s cubic-bezier(.2,.8,.2,1); }
    #slides.show-marker { transform:translateX(-50%); }
    .slide { position:relative; flex:0 0 50%; width:50%; height:100%; overflow:hidden; }
    .slide-label {
      position:absolute; top:11px; left:11px; z-index:4; padding:6px 9px; border-radius:999px;
      color:#fff; background:rgba(0,0,0,.58); border:1px solid rgba(255,255,255,.13);
      font-size:10px; font-weight:850; pointer-events:none;
    }
    .image-stage { position:absolute; inset:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
    .zoom-image {
      position:absolute; left:50%; top:50%; display:block; width:auto; height:auto; max-width:94%; max-height:93%;
      object-fit:contain; transform:translate(-50%,-50%); transform-origin:center center; will-change:transform;
      pointer-events:none; -webkit-user-drag:none; opacity:0; transition:opacity .15s ease;
      filter:drop-shadow(0 10px 28px rgba(0,0,0,.32));
    }
    .loader { position:absolute; left:50%; top:50%; width:32px; height:32px; margin:-16px; border:3px solid rgba(255,255,255,.18); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .image-error { position:absolute; left:50%; top:50%; width:min(82%,360px); transform:translate(-50%,-50%); color:#ffb4b4; font-size:12px; line-height:1.55; text-align:center; white-space:pre-line; }
    #gesture-hint {
      position:absolute; left:50%; bottom:10px; z-index:5; transform:translateX(-50%); padding:6px 9px;
      border-radius:999px; background:rgba(0,0,0,.55); color:rgba(255,255,255,.72); font-size:9px; white-space:nowrap; pointer-events:none;
      transition:opacity .3s ease;
    }

    #viewer-footer {
      height:64px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px;
      padding:9px 10px; border-top:1px solid rgba(255,255,255,.09);
    }
    #tabs { min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:4px; border-radius:999px; background:rgba(255,255,255,.07); }
    .tab { min-width:0; height:38px; padding:0 9px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,.6); font-size:11px; font-weight:900; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tab.active { color:#000; background:#fff; }
    #reset-zoom { height:44px; padding:0 12px; border-radius:999px; border:1px solid rgba(255,255,255,.12); color:#fff; background:rgba(255,255,255,.07); font-size:11px; font-weight:850; cursor:pointer; }

    #target-toast {
      position:fixed; left:50%; top:calc(var(--safe-top) + 45px); z-index:300; transform:translate(-50%,-10px);
      padding:8px 12px; border-radius:999px; color:#000; background:#fff; font-size:11px; font-weight:900;
      opacity:0; pointer-events:none; transition:opacity .16s ease,transform .16s ease;
    }
    #target-toast.show { opacity:1; transform:translate(-50%,0); }

    @media (orientation: landscape) and (max-height: 620px) {
      :root { --viewer-h:min(82dvh,520px); }
      body.viewer-open #scan-frame { top:18%; width:min(18vw,110px); }
      #viewer { left:50%; right:auto; width:min(760px,calc(100vw - 16px)); transform:translate(-50%,calc(100% + 40px)); }
      #viewer.open { transform:translate(-50%,0); }
    }

    @media (min-width: 760px) {
      #viewer { left:50%; right:auto; width:min(780px,calc(100vw - 28px)); transform:translate(-50%,calc(100% + 40px)); }
      #viewer.open { transform:translate(-50%,0); }
      body.viewer-open #scan-frame { width:135px; }
    }
  </style>
</head>
<body>
  <div id="ar-wrap">
    <a-scene
      id="ar-scene"
      embedded
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 3; missTolerance: 5; filterMinCF: 0.001; filterBeta: 20;"
      color-space="sRGB"
      renderer="colorManagement: true; alpha: true; antialias: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </div>

  <section id="start-screen">
    <div id="start-card">
      <div class="brand">YOYOJIN · ULSAN 2026</div>
      <h1>벽화 속 친구를<br>찾아보세요</h1>
      <p>벽화의 캐릭터를 카메라로 비추면<br>그 캐릭터가 태어난 아이의 원본 그림을 볼 수 있습니다.</p>
      <button id="start-button" type="button" disabled>준비 중…</button>
      <div id="boot-status">AR을 준비하고 있습니다…</div>
      <div id="debug-detail"></div>
    </div>
  </section>

  <div id="hud" hidden>
    <div id="status-pill">벽화의 캐릭터를 비춰 주세요</div>
    <div id="scan-frame" aria-hidden="true">
      <span class="scan-corner tl"></span><span class="scan-corner tr"></span>
      <span class="scan-corner bl"></span><span class="scan-corner br"></span>
    </div>
    <div id="scan-note">다른 캐릭터를 비추면 자동으로 다음 그림으로 바뀝니다</div>
  </div>

  <div id="target-toast">새 작품을 찾았습니다</div>

  <section id="viewer" aria-label="작품 비교 뷰어">
    <div id="sheet-handle"></div>
    <header id="viewer-header">
      <div id="viewer-heading">
        <div id="viewer-kicker">WALL MURAL ↔ ORIGINAL DRAWING</div>
        <div id="viewer-title">작품</div>
      </div>
      <div id="header-actions">
        <button id="expand-viewer" class="round-btn" type="button" aria-label="뷰어 확대">↗</button>
        <button id="close-viewer" class="round-btn" type="button" aria-label="뷰어 닫기">×</button>
      </div>
    </header>

    <main id="viewer-body">
      <div id="slides" class="show-artwork">
        <section class="slide" data-slide="artwork">
          <div class="slide-label">아이의 원본 그림</div>
          <div class="image-stage" id="stage-artwork">
            <div id="loader-artwork" class="loader" hidden></div>
            <img id="image-artwork" class="zoom-image" alt="아이의 원본 그림" draggable="false" />
            <div id="error-artwork" class="image-error" hidden></div>
          </div>
        </section>
        <section class="slide" data-slide="marker">
          <div class="slide-label">벽화 속 캐릭터</div>
          <div class="image-stage" id="stage-marker">
            <div id="loader-marker" class="loader" hidden></div>
            <img id="image-marker" class="zoom-image" alt="벽화 속 캐릭터" draggable="false" />
            <div id="error-marker" class="image-error" hidden></div>
          </div>
        </section>
      </div>
      <div id="gesture-hint">두 손가락 확대 · 확대 후 이동 · 좌우 스와이프</div>
    </main>

    <footer id="viewer-footer">
      <div id="tabs">
        <button id="tab-artwork" class="tab active" type="button">원본 그림</button>
        <button id="tab-marker" class="tab" type="button">벽화 캐릭터</button>
      </div>
      <button id="reset-zoom" type="button">크기 초기화</button>
    </footer>
  </section>

  <script>
    (() => {
      "use strict";

      const BUILD = "YOYOJIN_ULSAN_AR_V3_20260907";
      console.info(BUILD);

      const CONFIG = Object.freeze({
        manifestUrl: "./targets.json",
        targetUrl: "./targets.mind",
        maxZoom: 6,
        minZoom: 1,
        swipeThresholdPx: 48,
        targetSwitchDebounceMs: 180,
        sceneTimeoutMs: 16000,
        arTimeoutMs: 45000
      });

      const FALLBACK_ITEMS = [
        { id:"1", targetIndex:0, marker:"1.jpg", artwork:"1.jpeg", title:"작품 1" },
        { id:"2", targetIndex:1, marker:"2.jpg", artwork:"2.jpeg", title:"작품 2" },
        { id:"3", targetIndex:2, marker:"3.png", artwork:"3.jpeg", title:"작품 3" }
      ];

      const $ = (s) => document.querySelector(s);
      const sceneEl = $("#ar-scene");
      const arWrap = $("#ar-wrap");
      const startScreen = $("#start-screen");
      const startButton = $("#start-button");
      const bootStatus = $("#boot-status");
      const debugDetail = $("#debug-detail");
      const hud = $("#hud");
      const statusPill = $("#status-pill");
      const scanFrame = $("#scan-frame");
      const viewer = $("#viewer");
      const viewerTitle = $("#viewer-title");
      const closeViewerButton = $("#close-viewer");
      const expandViewerButton = $("#expand-viewer");
      const slides = $("#slides");
      const tabArtwork = $("#tab-artwork");
      const tabMarker = $("#tab-marker");
      const resetZoomButton = $("#reset-zoom");
      const targetToast = $("#target-toast");
      const gestureHint = $("#gesture-hint");

      const artworkImg = $("#image-artwork");
      const markerImg = $("#image-marker");
      const artworkError = $("#error-artwork");
      const markerError = $("#error-marker");
      const artworkLoader = $("#loader-artwork");
      const markerLoader = $("#loader-marker");
      const artworkStage = $("#stage-artwork");
      const markerStage = $("#stage-marker");

      const state = {
        items: [],
        anchors: [],
        arSystem: null,
        ready: false,
        started: false,
        starting: false,
        activeIndex: -1,
        currentSlide: "artwork",
        lastSwitchAt: 0,
        toastTimer: 0,
        hintTimer: 0
      };

      function setBoot(text) { bootStatus.textContent = text; }
      function setDebug(text="") { debugDetail.textContent = text; }
      function setStatus(text) { statusPill.textContent = text; }
      function clamp(v,min,max) { return Math.min(max,Math.max(min,v)); }
      function describeError(error) { return `${error?.name ? error.name + ": " : ""}${error?.message || String(error || "알 수 없는 오류")}`; }

      function fixCameraLayers() {
        const video = arWrap.querySelector("video");
        const canvases = arWrap.querySelectorAll("canvas");
        if (video) {
          video.style.setProperty("z-index","0","important");
          video.style.setProperty("display","block","important");
          video.style.setProperty("visibility","visible","important");
          video.style.setProperty("opacity","1","important");
          video.style.setProperty("object-fit","cover","important");
        }
        canvases.forEach((canvas) => {
          canvas.style.setProperty("z-index","1","important");
          canvas.style.setProperty("pointer-events","none","important");
          canvas.style.setProperty("background","transparent","important");
        });
      }

      async function fetchManifest() {
        try {
          const response = await fetch(`${CONFIG.manifestUrl}?v=${encodeURIComponent(BUILD)}`, { cache:"no-store" });
          if (!response.ok) throw new Error(`targets.json HTTP ${response.status}`);
          const data = await response.json();
          const raw = Array.isArray(data) ? data : data.items;
          if (!Array.isArray(raw) || raw.length === 0) throw new Error("targets.json의 items가 비어 있습니다.");
          const items = raw.map((item, order) => ({
            id: String(item.id ?? order + 1),
            targetIndex: Number.isInteger(item.targetIndex) ? item.targetIndex : order,
            marker: item.marker || item.target || `${order + 1}.jpg`,
            artwork: item.artwork || item.result || `${order + 1}.jpeg`,
            title: item.title || `작품 ${item.id ?? order + 1}`
          })).sort((a,b) => a.targetIndex - b.targetIndex);
          items.forEach((item,index) => {
            if (item.targetIndex !== index) throw new Error(`targetIndex가 0부터 연속이어야 합니다. ${index}번째 항목을 확인하세요.`);
          });
          return items;
        } catch (error) {
          console.warn("manifest fallback", error);
          setDebug("targets.json을 읽지 못해 현재 1~3번 테스트 설정으로 실행합니다.");
          return FALLBACK_ITEMS.map((x) => ({...x}));
        }
      }

      async function checkTargetsMind() {
        let response;
        try {
          response = await fetch(`${CONFIG.targetUrl}?v=${encodeURIComponent(BUILD)}`, { method:"HEAD", cache:"no-store" });
          if (response.ok) return;
        } catch (_) {}
        response = await fetch(`${CONFIG.targetUrl}?v=${encodeURIComponent(BUILD)}`, { cache:"no-store" });
        if (!response.ok) throw new Error(`targets.mind를 찾지 못했습니다. HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();
        if (buffer.byteLength < 32) throw new Error("targets.mind 파일이 비어 있거나 올바르지 않습니다.");
      }

      function waitForARSystem(timeoutMs=CONFIG.sceneTimeoutMs) {
        return new Promise((resolve,reject) => {
          const started = performance.now();
          const tick = () => {
            const system = sceneEl?.systems?.["mindar-image-system"];
            if (window.AFRAME && system) { resolve(system); return; }
            if (performance.now() - started > timeoutMs) {
              reject(new Error("A-Frame/MindAR 초기화가 완료되지 않았습니다. 인터넷 연결 또는 CDN 차단을 확인해 주세요."));
              return;
            }
            setTimeout(tick,100);
          };
          tick();
        });
      }

      function createTargetAnchors() {
        state.anchors.forEach((el) => el.remove());
        state.anchors = state.items.map((item,index) => {
          const entity = document.createElement("a-entity");
          entity.setAttribute("mindar-image-target", `targetIndex: ${index}`);
          entity.dataset.targetIndex = String(index);
          entity.addEventListener("targetFound", () => openTarget(index));
          entity.addEventListener("targetLost", () => onTargetLost(index));
          sceneEl.appendChild(entity);
          return entity;
        });
      }

      function clearImage(img,errorBox,loader) {
        img.onload = null; img.onerror = null; img.removeAttribute("src"); img.style.opacity="0";
        errorBox.hidden = true; errorBox.textContent=""; loader.hidden = false;
      }

      function loadImage(img,errorBox,loader,url,label) {
        clearImage(img,errorBox,loader);
        img.onload = () => { loader.hidden=true; errorBox.hidden=true; img.style.opacity="1"; };
        img.onerror = () => {
          loader.hidden=true; img.style.opacity="0"; errorBox.hidden=false;
          errorBox.textContent = `${label}을 불러오지 못했습니다.\n파일명 확인: ${url}`;
        };
        img.src = url;
      }

      function showToast(text) {
        clearTimeout(state.toastTimer); targetToast.textContent=text; targetToast.classList.add("show");
        state.toastTimer=setTimeout(() => targetToast.classList.remove("show"),1100);
      }

      function showHint() {
        clearTimeout(state.hintTimer); gestureHint.style.opacity="1";
        state.hintTimer=setTimeout(() => { gestureHint.style.opacity="0"; },3000);
      }

      function setSlide(name,{reset=false}={}) {
        state.currentSlide = name === "marker" ? "marker" : "artwork";
        slides.classList.toggle("show-marker",state.currentSlide === "marker");
        tabArtwork.classList.toggle("active",state.currentSlide === "artwork");
        tabMarker.classList.toggle("active",state.currentSlide === "marker");
        if (reset) resetCurrentZoom();
      }

      function openTarget(index) {
        const item = state.items[index];
        if (!item) return;
        const now = performance.now();
        if (state.activeIndex === index && now - state.lastSwitchAt < CONFIG.targetSwitchDebounceMs) return;
        state.lastSwitchAt = now;
        state.activeIndex = index;

        viewerTitle.textContent = `${item.title} · #${item.id}`;
        loadImage(artworkImg,artworkError,artworkLoader,item.artwork,"원본 그림");
        loadImage(markerImg,markerError,markerLoader,item.marker,"벽화 캐릭터 이미지");
        zoomControllers.artwork.reset(false);
        zoomControllers.marker.reset(false);
        setSlide("artwork");

        viewer.classList.add("open");
        document.body.classList.add("viewer-open");
        setStatus(`#${item.id} 인식 · 위쪽 카메라로 다른 캐릭터를 계속 찾을 수 있어요`);
        showToast(`#${item.id} 원본 그림을 찾았습니다`);
        showHint();
      }

      function onTargetLost(index) {
        if (index !== state.activeIndex) return;
        const item = state.items[index];
        setStatus(`#${item?.id ?? ""} 표시 중 · 다른 캐릭터를 비춰 주세요`);
      }

      function closeViewer() {
        viewer.classList.remove("open","expanded");
        document.body.classList.remove("viewer-open");
        expandViewerButton.textContent="↗";
        setStatus("벽화의 캐릭터를 비춰 주세요");
      }

      function toggleExpand() {
        const expanded = viewer.classList.toggle("expanded");
        expandViewerButton.textContent = expanded ? "↙" : "↗";
        setTimeout(() => {
          zoomControllers.artwork.limitAndRender();
          zoomControllers.marker.limitAndRender();
        },270);
      }

      function createZoomController(stage,image,key) {
        const z = { scale:1,x:0,y:0,pointers:new Map(),mode:"none",startScale:1,startX:0,startY:0,startDistance:1,startCenterX:0,startCenterY:0,singleStartX:0,singleStartY:0,lastTapAt:0 };

        function limitPan() {
          if (z.scale <= 1.001) { z.x=0; z.y=0; return; }
          const rect=stage.getBoundingClientRect();
          const maxX=rect.width*.55*(z.scale-1)+60;
          const maxY=rect.height*.55*(z.scale-1)+60;
          z.x=clamp(z.x,-maxX,maxX); z.y=clamp(z.y,-maxY,maxY);
        }
        function render(animated=false) {
          image.style.transition=animated?"transform .18s ease":"none";
          image.style.transform=`translate(calc(-50% + ${z.x}px), calc(-50% + ${z.y}px)) scale(${z.scale})`;
          if (animated) setTimeout(() => { image.style.transition="none"; },190);
        }
        function reset(animated=true) { z.scale=1; z.x=0; z.y=0; render(animated); }
        function prepare() {
          const pts=[...z.pointers.values()];
          if (pts.length>=2) {
            z.mode="pinch"; const a=pts[0],b=pts[1];
            z.startScale=z.scale; z.startX=z.x; z.startY=z.y;
            z.startDistance=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
            z.startCenterX=(a.x+b.x)/2; z.startCenterY=(a.y+b.y)/2;
          } else if (pts.length===1) {
            z.mode=z.scale>1.01?"pan":"swipe"; z.startX=z.x; z.startY=z.y;
            z.singleStartX=pts[0].x; z.singleStartY=pts[0].y;
          } else z.mode="none";
        }

        stage.addEventListener("pointerdown",(e) => {
          e.preventDefault(); stage.setPointerCapture?.(e.pointerId); z.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
          const now=performance.now();
          if (z.pointers.size===1 && now-z.lastTapAt<290) { reset(true); z.lastTapAt=0; }
          else if (z.pointers.size===1) z.lastTapAt=now;
          prepare();
        });

        stage.addEventListener("pointermove",(e) => {
          if (!z.pointers.has(e.pointerId)) return; e.preventDefault(); z.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
          const pts=[...z.pointers.values()];
          if (z.mode==="pinch" && pts.length>=2) {
            const a=pts[0],b=pts[1]; const dist=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
            const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
            z.scale=clamp(z.startScale*(dist/z.startDistance),CONFIG.minZoom,CONFIG.maxZoom);
            z.x=z.startX+(cx-z.startCenterX); z.y=z.startY+(cy-z.startCenterY); limitPan(); render();
          } else if (z.mode==="pan" && pts.length===1) {
            z.x=z.startX+(pts[0].x-z.singleStartX); z.y=z.startY+(pts[0].y-z.singleStartY); limitPan(); render();
          }
        });

        const finish=(e) => {
          if (!z.pointers.has(e.pointerId)) return; e.preventDefault();
          const p=z.pointers.get(e.pointerId); const wasSwipe=z.mode==="swipe"&&z.pointers.size===1;
          const dx=p.x-z.singleStartX, dy=p.y-z.singleStartY; z.pointers.delete(e.pointerId);
          if (wasSwipe && Math.abs(dx)>CONFIG.swipeThresholdPx && Math.abs(dx)>Math.abs(dy)*1.15) {
            if (dx<0) setSlide("marker"); else setSlide("artwork");
          }
          prepare();
        };
        stage.addEventListener("pointerup",finish); stage.addEventListener("pointercancel",finish);
        stage.addEventListener("lostpointercapture",(e)=>{ if(z.pointers.has(e.pointerId)){ z.pointers.delete(e.pointerId); prepare(); } });
        stage.addEventListener("wheel",(e)=>{ e.preventDefault(); z.scale=clamp(z.scale*(e.deltaY<0?1.12:.89),CONFIG.minZoom,CONFIG.maxZoom); limitPan(); render(); },{passive:false});

        return { reset, limitAndRender:() => { limitPan(); render(false); }, key };
      }

      const zoomControllers = {
        artwork:createZoomController(artworkStage,artworkImg,"artwork"),
        marker:createZoomController(markerStage,markerImg,"marker")
      };
      function resetCurrentZoom() { zoomControllers[state.currentSlide]?.reset(true); }

      async function initialize() {
        try {
          if (!window.isSecureContext && !["localhost","127.0.0.1"].includes(location.hostname)) {
            throw new Error("휴대폰 카메라는 HTTPS 주소에서만 실행할 수 있습니다.");
          }
          setDebug(""); setBoot("AR 라이브러리를 확인하고 있습니다…");
          state.arSystem = await waitForARSystem();
          setBoot("작품 연결 정보를 확인하고 있습니다…");
          state.items = await fetchManifest();
          setBoot(`${state.items.length}개 작품 확인 · targets.mind를 확인하고 있습니다…`);
          await checkTargetsMind();
          createTargetAnchors();
          state.ready=true; startButton.disabled=false; startButton.textContent="카메라 시작";
          setBoot(`${state.items.length}개 작품 준비 완료`);
        } catch (error) {
          console.error("initialize",error); state.ready=false; startButton.disabled=true; startButton.textContent="시작할 수 없음";
          setBoot("AR을 준비하지 못했습니다."); setDebug(describeError(error));
        }
      }

      function waitForARReady() {
        return new Promise((resolve,reject) => {
          let timer=0;
          const cleanup=()=>{ clearTimeout(timer); sceneEl.removeEventListener("arReady",onReady); sceneEl.removeEventListener("arError",onError); };
          const onReady=()=>{ cleanup(); resolve(); };
          const onError=(e)=>{ cleanup(); const detail=e?.detail?.error||e?.detail||"카메라 또는 AR 엔진 오류"; reject(detail instanceof Error?detail:new Error(String(detail))); };
          sceneEl.addEventListener("arReady",onReady,{once:true});
          sceneEl.addEventListener("arError",onError,{once:true});
          timer=setTimeout(()=>{ cleanup(); const err=new Error("카메라 또는 이미지 인식 엔진 준비 시간이 초과됐습니다."); err.name="TimeoutError"; reject(err); },CONFIG.arTimeoutMs);
        });
      }

      async function startAR() {
        if (!state.ready || state.started || state.starting || !state.arSystem) return;
        state.starting=true; startButton.disabled=true; startButton.textContent="카메라 여는 중…"; setBoot("카메라 권한을 요청하고 있습니다…"); setDebug("");
        try {
          const readyPromise=waitForARReady();
          state.arSystem.start();
          await readyPromise;
          state.started=true; state.starting=false; startScreen.hidden=true; hud.hidden=false;
          setStatus("벽화의 캐릭터를 비춰 주세요");
          fixCameraLayers(); setTimeout(fixCameraLayers,100); setTimeout(fixCameraLayers,600);
        } catch (error) {
          console.error("startAR",error); state.starting=false; state.started=false;
          try { state.arSystem.stop(); } catch(_) {}
          startButton.disabled=false; startButton.textContent="다시 시작";
          if (error?.name==="NotAllowedError") setBoot("카메라 권한이 차단되었습니다. Chrome 사이트 설정에서 카메라를 허용해 주세요.");
          else if (error?.name==="NotFoundError") setBoot("사용 가능한 카메라를 찾지 못했습니다.");
          else if (error?.name==="NotReadableError") setBoot("다른 앱이 카메라를 사용 중이거나 카메라를 열 수 없습니다.");
          else if (error?.name==="TimeoutError") setBoot("카메라/AR 엔진 준비 시간이 초과됐습니다.");
          else setBoot("카메라 시작 중 오류가 발생했습니다.");
          setDebug(describeError(error));
        }
      }

      startButton.addEventListener("click",startAR);
      closeViewerButton.addEventListener("click",closeViewer);
      expandViewerButton.addEventListener("click",toggleExpand);
      tabArtwork.addEventListener("click",()=>setSlide("artwork"));
      tabMarker.addEventListener("click",()=>setSlide("marker"));
      resetZoomButton.addEventListener("click",resetCurrentZoom);
      window.addEventListener("resize",()=>requestAnimationFrame(fixCameraLayers));
      window.addEventListener("pagehide",()=>{ try{state.arSystem?.stop();}catch(_){} });
      window.addEventListener("error",(e)=>{ if(!state.ready&&!state.started) setDebug(e.message||"스크립트 오류"); });
      window.addEventListener("unhandledrejection",(e)=>{ console.error(e.reason); if(!state.started) setDebug(describeError(e.reason)); });

      initialize();
    })();
  </script>
</body>
</html>
