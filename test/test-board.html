<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>벽화 화면 · 함께 살아가는 세계</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#243e31;font-family:system-ui,sans-serif}header{padding:18px 24px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;margin:8px 0}select,button{font:inherit;padding:10px;border-radius:8px;background:white;border:1px solid #a9b4a8;margin:5px 4px 5px 0}main{display:grid;place-items:center}img{display:block;width:min(70vh,90vw);height:min(70vh,90vw);object-fit:contain;background:white}#stage:fullscreen{background:white;display:grid;place-items:center;width:100vw;height:100vh}#stage:fullscreen img{width:min(96vh,96vw);height:min(96vh,96vw)}small{display:block;padding:12px 24px;color:#596a60}body{background:#f7f6f2;color:#20201e;font-family:system-ui,'Malgun Gothic',sans-serif}header{max-width:1040px;margin:auto;padding:24px}.page-brand{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid #deddd6}.page-brand img{width:148px;height:48px;object-fit:contain;object-position:left;background:transparent}.page-brand a{font-size:14px;color:inherit;text-decoration:none}h1{font-size:clamp(24px,4vw,32px);letter-spacing:-1px;margin:0 0 12px}p{line-height:1.8;color:#67675e}select,button{padding:12px 16px;border-radius:10px;border-color:#cac9c1;margin:12px 8px 6px 0;min-height:48px;max-width:100%}button{background:#20201e;color:#fff;border-color:#20201e;cursor:pointer}main{padding:0 24px 24px}small{max-width:1040px;margin:auto;padding:0 24px 32px;color:#67675e;font-size:13px;line-height:1.8}:focus-visible{outline:3px solid #c78627;outline-offset:4px}#stage:fullscreen{padding:0}</style><header><div class="page-brand"><img src="vendor/yoyojin/brand/ulsan-art-museum.png" alt="울산시립미술관"><a href="./index.html">관람 화면으로 ↗</a></div><h1>벽화의 한 장면을 만나 보세요</h1><p>휴대폰에서 관람 페이지의 카메라를 열고 아래 그림을 비춰 보세요.<br>그림 위에 나타난 점을 누르면 아이의 원화와 이야기를 볼 수 있습니다.</p><select id="target" aria-label="화면에 보여 줄 벽화 부분"></select><button id="full">벽화만 크게 보기</button><p id="info" role="status"></p></header><main id="stage"><img id="picture" alt="휴대폰 카메라로 비춰 볼 벽화"></main><small>그림이 카메라 화면 안에 들어오도록 비춰 주세요. 컴퓨터 화면과 실제 전시장에서는 인식 환경이 다를 수 있습니다. 크게 보기를 종료하려면 Esc를 누르세요.</small><script type="module">
const items=await(await fetch('./data/test-board.json',{cache:'no-store'})).json(),target=document.getElementById('target');
for(const item of items){const option=document.createElement('option');option.value=item.image;option.textContent=`벽화 장면 ${Number(item.image.match(/zone-(\d+)/)[1])+1}`;target.append(option);}
const best=[...items].sort((a,b)=>b.ids.length-a.ids.length)[0];if(best)target.value=best.image;
function show(){const item=items.find(i=>i.image===target.value);if(!item){document.getElementById('info').textContent='아직 준비된 벽화 장면이 없습니다.';return;}document.getElementById('picture').src=item.image;document.getElementById('info').textContent=`이 장면에서 ${item.ids.length}개의 이야기를 만나 볼 수 있습니다.`;}
target.onchange=show;document.getElementById('full').onclick=()=>document.getElementById('stage').requestFullscreen().catch(()=>{});show();
</script></html>
