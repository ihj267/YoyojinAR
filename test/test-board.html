<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>휴대폰으로 비출 벽화 · AR 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#243e31;font-family:system-ui,sans-serif}header{padding:18px 24px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;margin:8px 0}select,button{font:inherit;padding:10px;border-radius:8px;background:white;border:1px solid #a9b4a8;margin:5px 4px 5px 0}main{display:grid;place-items:center}img{display:block;width:min(70vh,90vw);height:min(70vh,90vw);object-fit:contain;background:white}#stage:fullscreen{background:white;display:grid;place-items:center;width:100vw;height:100vh}#stage:fullscreen img{width:min(96vh,96vw);height:min(96vh,96vw)}small{display:block;padding:12px 24px;color:#596a60}</style><header><h1>이 벽화를 휴대폰 카메라로 비춰 주세요</h1><p>휴대폰에서 테스트 페이지를 열고, 아래와 같은 구역을 선택한 뒤 카메라를 켜세요.</p><select id="bank" aria-label="시험 구역"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select><select id="target" aria-label="시험할 벽화 부분"></select><button id="full">벽화만 크게 보기</button><p id="info" role="status"></p></header><main id="stage"><img id="picture" alt="휴대폰으로 비출 벽화 인식 이미지"></main><small>그림 테두리가 카메라 화면 안에 들어오도록 비춰 보세요. 컴퓨터 화면 시험은 작동 확인용이며, 실제 크기·조명·관람 거리에서의 검증은 별도로 필요합니다. 크게 보기 종료: Esc.</small><script type="module">
const items=await (await fetch('./data/test-board.json')).json(),bank=document.getElementById('bank'),target=document.getElementById('target');
function show(){const item=items.find(i=>i.image===target.value);document.getElementById('picture').src=item.image;document.getElementById('info').textContent=`휴대폰 선택: ${item.label} · 이 부분 안의 확정 작품 ${item.ids.length}개 (${item.ids.join(', ')||'없음'})`;}
function change(){target.replaceChildren();const local=items.filter(i=>i.bank===bank.value).sort((a,b)=>b.ids.length-a.ids.length);for(const item of local){const option=document.createElement('option');option.value=item.image;option.textContent=`부분 ${item.targetIndex+1} · 확정 작품 ${item.ids.length}개`;target.append(option);}show();}
bank.onchange=change;target.onchange=show;document.getElementById('full').onclick=()=>document.getElementById('stage').requestFullscreen().catch(()=>{});change();
</script></html>
